                                                BorderThickness: =1
                                                Color: =RGBA(25, 54, 92, 1)
                                                DisplayMode: =If(varM06Busy || varM06Unknown || !varM06Ready, DisplayMode.Disabled, DisplayMode.Edit)
                                                Fill: =RGBA(255, 255, 255, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =42
                                                HoverColor: =RGBA(255, 255, 255, 1)
                                                HoverFill: =RGBA(15, 108, 189, 1)
                                                OnSelect: =Set(varM06Server, ThisItem.Server); Set(varM06EnvActive, true); SetFocus(lblM06ServerContext)
                                                PressedColor: =RGBA(255, 255, 255, 1)
                                                PressedFill: =RGBA(9, 82, 144, 1)
                                                RadiusBottomLeft: =4
                                                RadiusBottomRight: =4
                                                RadiusTopLeft: =4
                                                RadiusTopRight: =4
                                                Size: =12
                                                Text: ="環境を見る"
                                                Tooltip: ="環境を見る"
                                                Width: =148
                                                X: =Parent.TemplateWidth - 162
                                                Y: =14
                                          - srvM06Rename:
                                              Control: Classic/Button
                                              Properties:
                                                BorderColor: =RGBA(208, 220, 234, 1)
                                                BorderThickness: =1
                                                Color: =RGBA(25, 54, 92, 1)
                                                DisplayMode: =If(varM06Busy || varM06Unknown || !varM06Ready, DisplayMode.Disabled, DisplayMode.Edit)
                                                Fill: =RGBA(255, 255, 255, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =42
                                                HoverColor: =RGBA(255, 255, 255, 1)
                                                HoverFill: =RGBA(15, 108, 189, 1)
                                                OnSelect: |-
                                                  =If(!varM06Busy && !varM06Unknown,
                                                  Set(varM06Op, "renameServer"); Set(varM06Target, First(Filter(colM06Rows, Server = ThisItem.Server)).Id);
                                                  Set(varM06OldServer, ThisItem.Server); Set(varM06OldEnv, "");
                                                  Set(varM06NewServer, varM06OldServer); Set(varM06NewEnv, varM06OldEnv);
                                                  Set(varM06Expected, ForAll(Filter(colM06Rows, Server = varM06OldServer) As proof, {id: proof.Id, version: proof.Version}));
                                                  Set(varM06Error, ""); Set(varM06Dialog, "edit");
                                                  Reset(txtM06Server); Reset(txtM06Env)
                                                  )
