Screens:
  Screen5:
    Properties:
      Fill: =RGBA(243, 246, 250, 1)
      OnVisible: =Set(varM06Busy, false); Set(varM06Unknown, false); Set(varM06Ready, false); Set(varM06Dialog, ""); Set(varM06Error, ""); Set(varM06ServerActive, true); Set(varM06EnvActive, true); Select(btnM06Reload)
    Children:
      - grdM06Scroll:
          Control: FluidGrid
          Properties:
            BorderThickness: =0
            Height: =Parent.Height
            Width: =Parent.Width
          Children:
            - crdM06ScrollBody:
                Control: DataCard
                Variant: BlankCard
                Properties:
                  Height: =conM06Center.Height
                  Width: =Parent.Width
                  X: =0
                  Y: =0
                Children:
                  - conM06Center:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =Max(Screen5.Height, pnlM06Lists.Y + pnlM06Lists.Height + 24)
                        Width: =Min(Parent.Width - 48, 1200)
                        X: =(Parent.Width - Self.Width) / 2
                      Children:
                        - btnM06Back:
                            Control: Classic/Button
                            Properties:
                              BorderColor: =RGBA(208, 220, 234, 1)
                              BorderThickness: =1
                              Color: =RGBA(25, 54, 92, 1)
                              DisplayMode: =If(varM06Busy || varM06Unknown || !varM06Ready, DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              Height: =36
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(15, 108, 189, 1)
                              OnSelect: =Navigate(Screen2, ScreenTransition.None)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(9, 82, 144, 1)
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Size: =12
                              Text: ="進捗一覧に戻る"
                              Tooltip: ="進捗一覧に戻る"
                              Width: =192
                              Y: =18
                        - lblM06Title:
                            Control: Label
                            Properties:
                              Color: =RGBA(25, 54, 92, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =52
                              Size: =If(Parent.Width < 450, 20, 24)
                              Text: ="環境・サーバーの管理"
                              Width: =Parent.Width
                              Y: =70
                        - lblM06Error:
                            Control: Label
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(163, 38, 45, 1)
                              Font: =Font.'Segoe UI'
                              Height: =48
                              Size: =14
                              Text: =varM06Error
                              Visible: =!IsBlank(varM06Error) && IsBlank(varM06Dialog)
                              Width: =Parent.Width
                              Y: =126
                        - btnM06Reload:
                            Control: Classic/Button
                            Properties:
                              BorderColor: =RGBA(208, 220, 234, 1)
                              BorderThickness: =1
                              Color: =RGBA(25, 54, 92, 1)
                              DisplayMode: =If(varM06Busy, DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              Height: =42
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(15, 108, 189, 1)
                              OnSelect: |-
                                =If(!varM06Busy,
                                Set(varM06Busy, true); Set(varM06Error, ""); Set(varM06Op, "list");
                                IfError(Set(varM06Reply, '架空ログ証跡_環境サーバー管理'.Run(JSON({operation: "list"}, JSONFormat.Compact)));
                                Set(varM06Parsed, ParseJSON(varM06Reply.result));
                                If(Boolean(varM06Parsed.ok),
                                  ClearCollect(colM06Rows, ForAll(Table(varM06Parsed.rows) As saved, {
                                    Id: Text(saved.Value.id), Version: Text(saved.Value.version),
                                    Server: Text(saved.Value.server), Env: Text(saved.Value.environment),
                                    ServerEnabled: Boolean(saved.Value.serverEnabled), EnvEnabled: Boolean(saved.Value.environmentEnabled)
                                  }));
                                  Set(varM06Unknown, false);
                                  Set(varM06Error, "");
                                  Set(varM06Dialog, "");
                                  If(varM06Op = "renameServer" || varM06Op = "addServer", Set(varM06Server, varM06NewServer));
                                  If(IsBlank(LookUp(colM06Rows, Server = varM06Server)), Set(varM06Server, First(Filter(colM06Rows, ServerEnabled)).Server));
                                  Set(varM06Ready, true),
                                  Set(varM06Error, Text(varM06Parsed.reason));
                                  If(("読み直して" in varM06Error || "画面を開き直して" in varM06Error), Set(varM06Unknown, true))
                                ),
                                Set(varM06Error, "登録内容を読み取れません。読み直してから操作してください。"); Set(varM06Unknown, true));
                                Set(varM06Busy, false))
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(9, 82, 144, 1)
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Size: =12
                              Text: ="読み直す"
                              Tooltip: ="読み直す"
                              Visible: =!IsBlank(varM06Error) && IsBlank(varM06Dialog)
                              Width: =120
                              Y: =lblM06Error.Y + lblM06Error.Height + 6
                        - pnlM06Lists:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =If(Self.Width > 760, Max(srvM06Panel.Height, envM06Panel.Height), srvM06Panel.Height + envM06Panel.Height + 24)
                              Width: =Parent.Width
                              Y: =If(lblM06Error.Visible, btnM06Reload.Y + 58, 132)
                            Children:
                              - srvM06Panel:
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =RGBA(208, 220, 234, 1)
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =srvM06List.Y + srvM06List.Height + 18
                                    Width: =If(Parent.Width > 760, (Parent.Width - 24) / 2, Parent.Width)
                                  Children:
                                    - srvM06Title:
                                        Control: Label
                                        Properties:
                                          Color: =RGBA(25, 54, 92, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =42
                                          Size: =20
                                          Text: ="サーバー"
                                          Width: =Parent.Width - 180
                                          X: =18
                                          Y: =18
                                    - srvM06Add:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =RGBA(15, 108, 189, 1)
                                          BorderThickness: =1
                                          Color: =RGBA(255, 255, 255, 1)
                                          DisplayMode: =If(varM06Busy || varM06Unknown || !varM06Ready, DisplayMode.Disabled, DisplayMode.Edit)
                                          Fill: =RGBA(15, 108, 189, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =42
                                          HoverColor: =RGBA(255, 255, 255, 1)
                                          HoverFill: =RGBA(15, 108, 189, 1)
                                          OnSelect: |-
                                            =If(!varM06Busy && !varM06Unknown,
                                            Set(varM06Op, "addServer"); Set(varM06Target, Blank());
                                            Set(varM06OldServer, ""); Set(varM06OldEnv, "");
                                            Set(varM06NewServer, varM06OldServer); Set(varM06NewEnv, varM06OldEnv);
                                            Set(varM06Expected, ForAll(colM06Rows As proof, {id: proof.Id, version: proof.Version}));
                                            Set(varM06Error, ""); Set(varM06Dialog, "edit");
                                            Reset(txtM06Server); Reset(txtM06Env)
                                            )
                                          PressedColor: =RGBA(255, 255, 255, 1)
                                          PressedFill: =RGBA(9, 82, 144, 1)
                                          RadiusBottomLeft: =4
                                          RadiusBottomRight: =4
                                          RadiusTopLeft: =4
                                          RadiusTopRight: =4
                                          Size: =12
                                          Text: ="サーバーを追加"
                                          Tooltip: ="サーバーを追加"
                                          Width: =150
                                          X: =Parent.Width - 168
                                          Y: =18
                                    - srvM06TabActive:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =RGBA(208, 220, 234, 1)
                                          BorderThickness: =1
                                          Color: =RGBA(25, 54, 92, 1)
                                          DisplayMode: =If(varM06Busy || varM06Unknown || !varM06Ready, DisplayMode.Disabled, DisplayMode.Edit)
                                          Fill: =If(varM06ServerActive, RGBA(232, 242, 253, 1), RGBA(255, 255, 255, 1))
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =If(varM06ServerActive, FontWeight.Semibold, FontWeight.Normal)
                                          Height: =42
                                          HoverColor: =RGBA(255, 255, 255, 1)
                                          HoverFill: =RGBA(15, 108, 189, 1)
                                          OnSelect: =Set(varM06ServerActive, true)
                                          PressedColor: =RGBA(255, 255, 255, 1)
                                          PressedFill: =RGBA(9, 82, 144, 1)
                                          RadiusBottomLeft: =4
                                          RadiusBottomRight: =4
                                          RadiusTopLeft: =4
                                          RadiusTopRight: =4
                                          Size: =12
                                          Text: ="使用中のサーバー"
                                          Tooltip: ="使用中のサーバー"
                                          Width: =148
                                          X: =18
                                          Y: =74
                                    - srvM06TabEnded:
