                                          Items: =SortByColumns(DropColumns(GroupBy(Filter(colM06Rows, ServerEnabled = varM06ServerActive), Server, Members), Members), "Server", SortOrder.Ascending)
                                          Selectable: =false
                                          ShowScrollbar: =false
