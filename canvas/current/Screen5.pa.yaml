                                          BorderColor: =RGBA(208, 220, 234, 1)
                                          BorderThickness: =1
                                          Color: =RGBA(25, 54, 92, 1)
                                          DisplayMode: =If(varM06Busy || varM06Unknown || !varM06Ready, DisplayMode.Disabled, DisplayMode.Edit)
                                          Fill: =If(!varM06ServerActive, RGBA(232, 242, 253, 1), RGBA(255, 255, 255, 1))
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =If(!varM06ServerActive, FontWeight.Semibold, FontWeight.Normal)
                                          Height: =42
                                          HoverColor: =RGBA(255, 255, 255, 1)
                                          HoverFill: =RGBA(15, 108, 189, 1)
                                          OnSelect: =Set(varM06ServerActive, false)
                                          PressedColor: =RGBA(255, 255, 255, 1)
                                          PressedFill: =RGBA(9, 82, 144, 1)
