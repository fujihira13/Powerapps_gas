Screens:
  Screen3:
    Properties:
      Fill: =RGBA(243, 246, 250, 1)
      LoadingSpinnerColor: =RGBA(0, 96, 160, 1)
      OnVisible: =Refresh('件別ファイル'); Reset(clip01_radCaseJudgment); Reset(clip01_txtCaseComment); Set(varCaseEditsPending, false); Set(varCaseReturnNeedsSave, varEvidenceCase.レビュー状態 = "差し戻し"); Set(varCaseRequestBusy, false); Set(varCaseRequestError, ""); Set(varCaseRequestConfirm, false); Set(varCaseConfirmId, Blank()); Set(varCaseMissingPage, 1); Set(varCaseUnexpectedPage, 1); ClearCollect(colCaseMissingIds, Filter(Split(Coalesce(varEvidenceCase.MQ結果テキスト, ""), Char(10)), "ログ未記録" in Value || "ログに記録なし" in Value)); ClearCollect(colCaseUnexpectedIds, Filter(Split(Coalesce(varEvidenceCase.MQ結果テキスト, ""), Char(10)), "予定外ID" in Value || "一覧にない" in Value)); Set(varDetailReviewBusy, false); Set(varDetailReviewError, ""); Reset(detailReviewDecision); Reset(detailReviewReason)
    Children:
      - clip01_VScroll:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            Width: =Parent.Width
          Children:
            - clip01_Body:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Start
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Max(Parent.Height, clip01_lblCaseRequestHelp.Y + clip01_lblCaseRequestHelp.Height + 24, If(clip01_lblCaseMissingHeading.Visible, clip01_galCaseMqResults.Y + clip01_galCaseMqResults.Height + 56, 0), If(clip01_lblCaseUnexpectedHeading.Visible, clip01_galCaseUnexpected.Y + clip01_galCaseUnexpected.Height + 56, 0), If(clip01_lblCaseFailure.Visible, clip01_lblCaseFailure.Y + clip01_lblCaseFailure.Height + 24, 0), If(detailReviewRecord.Visible, detailReviewRecord.Y + detailReviewRecord.Height + 24, 0), If(detailReviewSavedResult.Visible, detailReviewSavedResult.Y + detailReviewSavedResult.Height + 24, 0), If(detailReviewSavedReason.Visible, detailReviewSavedReason.Y + detailReviewSavedReason.Height + 24, 0), If(detailReviewError.Visible, detailReviewError.Y + detailReviewError.Height + 24, 0))
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =Parent.Width - 16
                Children:
                  - clip01_lblCaseTitle:
                      Control: Label
                      Properties:
                        Color: =RGBA(25, 54, 92, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =52
                        Size: =If(Parent.Width < 640, 20, 28)
                        Text: ="ログと結果の確認"
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =clip01_btnCaseBack.Y + clip01_btnCaseBack.Height + 8
                  - clip01_lblCaseIdentity:
                      Control: Label
                      Properties:
                        Color: =RGBA(42, 57, 75, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =68
                        Size: =14
                        Text: |-
                          =Coalesce(varEvidenceCase.件の表示名, "—") &
                          Char(10) & "環境: " & Substitute(Coalesce(varEvidenceCase.環境, "—"), "架空", "") & " / サーバー: " & Substitute(Coalesce(varEvidenceCase.サーバー, "—"), "架空", "") &
                          Char(10) & If(
                            IsBlank(varEvidenceCase.作成日),
                            "受付日時: —",
                            "受付日時: " & Text(
                              DateAdd(
                                DateAdd(varEvidenceCase.作成日, TimeZoneOffset(varEvidenceCase.作成日), TimeUnit.Minutes),
                                9,
                                TimeUnit.Hours
                              ),
                              "[$-ja-JP]yyyy-mm-dd hh:mm:ss"
                            ) & " JST"
                          )
                        Tooltip: |-
                          ="照合番号: " & Text(varEvidenceCase.架空ログ証跡件)
                        Width: =If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48)
                        X: =24
                        Y: =clip01_lblCaseTitle.Y + clip01_lblCaseTitle.Height + 2
                  - clip01_lblCaseLogHeading:
                      Control: Label
                      Properties:
                        Color: =RGBA(25, 54, 92, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        Size: =16
                        Text: =If(IsBlank(varEvidenceCase.バッチExcelファイル名), "過去の添付ファイル", "照合に使用したファイル")
                        Width: =If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48)
                        X: =If(Parent.Width >= 900, Parent.Width / 2 + 12, 24)
                        Y: =If(Parent.Width >= 900, 72, Max(clip01_lblCaseExcelCheck.Y + clip01_lblCaseExcelCheck.Height, If(clip01_lblCaseMissingHeading.Visible, clip01_galCaseMqResults.Y + clip01_galCaseMqResults.Height + If(CountRows(colCaseMissingIds) > 10, 44, 0), 0), If(clip01_lblCaseUnexpectedHeading.Visible, clip01_galCaseUnexpected.Y + clip01_galCaseUnexpected.Height + If(CountRows(colCaseUnexpectedIds) > 10, 44, 0), 0), If(clip01_lblCaseFailure.Visible, clip01_lblCaseFailure.Y + clip01_lblCaseFailure.Height, 0)) + 16)
                  - clip01_frmCaseSourceLog:
                      Control: Form
                      Variant: Classic
                      Layout: Vertical
                      Properties:
                        DataSource: ='架空ログ証跡件'
                        DefaultMode: =FormMode.View
                        Height: =Max(80, CountRows(varEvidenceCase.Attachments) * 58 + 24)
                        Item: =LookUp('架空ログ証跡件', 架空ログ証跡件 = varEvidenceCase.架空ログ証跡件)
                        NumberOfColumns: =1
                        Visible: =CountRows(Filter('件別ファイル', 対象件.架空ログ証跡件 = varEvidenceCase.架空ログ証跡件)) = 0
                        Width: =If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48)
                        X: =If(Parent.Width >= 900, Parent.Width / 2 + 12, 24)
                        Y: =clip01_lblCaseLogHeading.Y + 34
                      Children:
                        - clip01_attCaseSourceLog_DataCard:
                            Control: TypedDataCard
                            Variant: ClassicAttachmentsEdit
                            IsLocked: true
                            Properties:
                              BorderColor: =RGBA(245, 245, 245, 1)
                              DataField: ="{Attachments}"
                              Default: =ThisItem.Attachments
                              DisplayName: ="元ログ"
                              Height: =Parent.Height
                              Required: =true
                              Update: =ThisItem.Attachments
                              Width: =915
                              X: =0
                              Y: =0
                            Children:
                              - clip01_attCaseSourceLog:
                                  Control: Attachments
                                  MetadataKey: FieldValue
                                  Properties:
                                    AccessibleLabel: ="元ログ"
                                    DisplayMode: =DisplayMode.View
                                    Height: =Parent.Height
                                    Items: =ThisItem.Attachments
                                    Items.Name: =DisplayName
                                    Items.Value: =Id
                                    NoAttachmentsText: =""
                                    Width: =Parent.Width - 12
                                    X: =6
                  - clip01_s03OneLogHeading:
                      Control: Label
                      Properties:
                        Color: =RGBA(25, 54, 92, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =26
                        Text: ="サーバーログ（txt）"
                        Visible: =CountIf('件別ファイル', 対象件.架空ログ証跡件 = varEvidenceCase.架空ログ証跡件 && ファイル種別 = "log") = 1
                        Width: =If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48)
                        X: =If(Parent.Width >= 900, Parent.Width / 2 + 12, 24)
                        Y: =clip01_lblCaseLogHeading.Y + 34
                  - clip01_s03OneLogForm:
                      Control: Form
                      Variant: Classic
                      Layout: Vertical
                      Properties:
                        DataSource: ='件別ファイル'
                        DefaultMode: =FormMode.View
                        Height: =60
                        Item: =LookUp('件別ファイル', 対象件.架空ログ証跡件 = varEvidenceCase.架空ログ証跡件 && ファイル種別 = "log")
                        NumberOfColumns: =1
                        Visible: =!IsBlank(LookUp('件別ファイル', 対象件.架空ログ証跡件 = varEvidenceCase.架空ログ証跡件 && ファイル種別 = "log").件別ファイル)
                        Width: =If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48)
                        X: =If(Parent.Width >= 900, Parent.Width / 2 + 12, 24)
                        Y: =clip01_lblCaseLogHeading.Y + 60
                      Children:
                        - clip01_s03OneLogAttachmentCard:
                            Control: TypedDataCard
                            Variant: ClassicAttachmentsEdit
                            IsLocked: true
                            Properties:
                              DataField: ="{Attachments}"
                              Default: =ThisItem.Attachments
                              DisplayName: ="サーバーログ（txt）"
                              Height: =Parent.Height
                              Required: =false
                              Update: =ThisItem.Attachments
                              Width: =915
                              X: =0
                              Y: =0
                            Children:
                              - clip01_s03OneLogAttachment:
                                  Control: Attachments
                                  MetadataKey: FieldValue
                                  Properties:
                                    AccessibleLabel: ="サーバーログ（txt）"
                                    DisplayMode: =DisplayMode.View
                                    Height: =Parent.Height
                                    Items: =ThisItem.Attachments
                                    Items.Name: =DisplayName
                                    Items.Value: =Id
                                    NoAttachmentsText: =""
                                    Width: =Parent.Width - 12
                                    X: =6
                  - clip01_s03OneExcelHeading:
                      Control: Label
                      Properties:
                        Color: =RGBA(25, 54, 92, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =26
                        Text: ="更新対象一覧（Excel）"
                        Visible: =CountIf('件別ファイル', 対象件.架空ログ証跡件 = varEvidenceCase.架空ログ証跡件 && ファイル種別 = "excel") = 1
                        Width: =If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48)
                        X: =If(Parent.Width >= 900, Parent.Width / 2 + 12, 24)
                        Y: =clip01_s03OneLogForm.Y + clip01_s03OneLogForm.Height + 8
                  - clip01_s03OneExcelForm:
                      Control: Form
                      Variant: Classic
                      Layout: Vertical
                      Properties:
                        DataSource: ='件別ファイル'
                        DefaultMode: =FormMode.View
                        Height: =60
                        Item: =LookUp('件別ファイル', 対象件.架空ログ証跡件 = varEvidenceCase.架空ログ証跡件 && ファイル種別 = "excel")
                        NumberOfColumns: =1
                        Visible: =!IsBlank(LookUp('件別ファイル', 対象件.架空ログ証跡件 = varEvidenceCase.架空ログ証跡件 && ファイル種別 = "excel").件別ファイル)
                        Width: =If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48)
                        X: =If(Parent.Width >= 900, Parent.Width / 2 + 12, 24)
                        Y: =clip01_s03OneExcelHeading.Y + 26
                      Children:
                        - clip01_s03OneExcelAttachmentCard:
                            Control: TypedDataCard
                            Variant: ClassicAttachmentsEdit
                            IsLocked: true
                            Properties:
                              DataField: ="{Attachments}"
                              Default: =ThisItem.Attachments
                              DisplayName: ="更新対象一覧（Excel）"
                              Height: =Parent.Height
                              Required: =false
                              Update: =ThisItem.Attachments
                              Width: =915
                              X: =0
                              Y: =0
                            Children:
                              - clip01_s03OneExcelAttachment:
                                  Control: Attachments
                                  MetadataKey: FieldValue
                                  Properties:
                                    AccessibleLabel: ="更新対象一覧（Excel）"
                                    DisplayMode: =DisplayMode.View
                                    Height: =Parent.Height
                                    Items: =ThisItem.Attachments
                                    Items.Name: =DisplayName
                                    Items.Value: =Id
                                    NoAttachmentsText: =""
                                    Width: =Parent.Width - 12
                                    X: =6
                  - clip01_lnkCaseEvidenceExcel:
                      Control: ModernLink
                      Properties:
                        AccessibleLabel: ="照合結果をExcelで開く"
                        DisplayMode: |-
                          =If(
                            IsBlank(varEvidenceCase.証跡Excel) ||
                            varEvidenceCase.処理状態 <> "転記済み" ||
                            varEvidenceCase.Excel反映確認 <> "全文一致" ||
                            !If(
                              !IsBlank(LookUp('件別ファイル', 対象件.架空ログ証跡件 = varEvidenceCase.架空ログ証跡件 && ファイル種別 = "log").件別ファイル) && !IsBlank(LookUp('件別ファイル', 対象件.架空ログ証跡件 = varEvidenceCase.架空ログ証跡件 && ファイル種別 = "excel").件別ファイル),
                              true,
                              CountRows(Filter('件別ファイル', 対象件.架空ログ証跡件 = varEvidenceCase.架空ログ証跡件)) = 0 && CountIf(varEvidenceCase.Attachments, EndsWith(Lower(DisplayName), ".xlsx")) = 1
                            ),
                            DisplayMode.Disabled,
                            DisplayMode.Edit
                          )
                        Text: ="照合結果をExcelで開く"
                        URL: =varEvidenceCase.証跡Excel
                        Width: =If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48)
                        X: =If(Parent.Width >= 900, Parent.Width / 2 + 12, 24)
                        Y: =clip01_s03OneExcelForm.Y + clip01_s03OneExcelForm.Height + 4
                  - clip01_lblCaseExcelCheck:
                      Control: Label
                      Properties:
                        Color: =RGBA(42, 57, 75, 1)
                        Font: =Font.'Segoe UI'
                        Height: =66
                        Size: =14
                        Text: |-
                          =If(varEvidenceCase.処理状態 = "停止" || varEvidenceCase.処理状態 = "結果不明", "照合できません", If(
                            IsBlank(varEvidenceCase.バッチExcelファイル名),
                            "過去のログ記録",
                            With(
                              {differenceCount: CountRows(Filter(Split(Coalesce(varEvidenceCase.MQ結果テキスト, ""), Char(10)), "ログ未記録" in Value || "ログに記録なし" in Value || "予定外ID" in Value || "一覧にない" in Value))},
                              "照合結果: " & If(
                                varEvidenceCase.処理状態 = "転記済み" && varEvidenceCase.Excel反映確認 = "全文一致" && varEvidenceCase.MQ終端状態 = "あり" && !IsBlank(varEvidenceCase.証跡Excel) && varEvidenceCase.MQ比較状態 = "比較完了" && differenceCount = 0,
                                "差異なし（0件）",
                                varEvidenceCase.処理状態 = "転記済み" && varEvidenceCase.Excel反映確認 = "全文一致" && varEvidenceCase.MQ終端状態 = "あり" && !IsBlank(varEvidenceCase.証跡Excel) && varEvidenceCase.MQ比較状態 = "要確認" && differenceCount > 0,
                                "差異あり（" & Text(differenceCount, "0") & "件）",
                                varEvidenceCase.MQ終端状態 = "なし",
                                "ログの終了を確認できません",
                                "確認中"
                              ) & Char(10) &
                              "ExcelのID: " & If(IsBlank(varEvidenceCase.MQ予定件数), "未確定", Text(varEvidenceCase.MQ予定件数, "0") & "件") &
                              " / ログのID: " & If(IsBlank(varEvidenceCase.MQ記録件数), "未確定", Text(varEvidenceCase.MQ記録件数, "0") & "件")
                            )
                          ))
                        Width: =If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48)
                        X: =24
                        Y: =clip01_lblCaseIdentity.Y + clip01_lblCaseIdentity.Height + 6
                  - clip01_lblCaseMissingHeading:
                      Control: Label
                      Properties:
                        Color: =RGBA(25, 54, 92, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =26
                        Size: =15
                        Text: ="ログに記録されていないID（" & Text(CountRows(colCaseMissingIds), "0") & "件）"
                        Visible: =CountRows(colCaseMissingIds) > 0
                        Width: =If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48)
                        X: =24
                        Y: =clip01_lblCaseExcelCheck.Y + clip01_lblCaseExcelCheck.Height + 8
                  - clip01_galCaseMqResults:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: ="ログに記録されていないID"
                        Height: =Min(10, CountRows(colCaseMissingIds)) * 32
                        Items: =FirstN(LastN(colCaseMissingIds, Max(0, CountRows(colCaseMissingIds) - (varCaseMissingPage - 1) * 10)), 10)
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: =32
                        Visible: =clip01_lblCaseMissingHeading.Visible
                        Width: =If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48)
                        X: =24
                        Y: =clip01_lblCaseMissingHeading.Y + clip01_lblCaseMissingHeading.Height + 2
                      Children:
                        - clip01_lblCaseMqResultRow:
                            Control: Label
                            Properties:
                              Color: =RGBA(42, 57, 75, 1)
                              Font: =Font.'Segoe UI'
                              Height: =28
                              Size: =14
                              Text: =First(Split(ThisItem.Value, Char(9))).Value
                              Width: =Parent.TemplateWidth - 8
                              X: =4
                  - clip01_lblCaseUnexpectedHeading:
                      Control: Label
                      Properties:
                        Color: =RGBA(25, 54, 92, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =26
                        Size: =15
                        Text: ="一覧にないIDがログにあります（" & Text(CountRows(colCaseUnexpectedIds), "0") & "件）"
                        Visible: =CountRows(colCaseUnexpectedIds) > 0
                        Width: =If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48)
                        X: =24
                        Y: =If(clip01_lblCaseMissingHeading.Visible, clip01_galCaseMqResults.Y + clip01_galCaseMqResults.Height + If(CountRows(colCaseMissingIds) > 10, 50, 8), clip01_lblCaseMissingHeading.Y)
                  - clip01_galCaseUnexpected:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: ="一覧にないID"
                        Height: =Min(10, CountRows(colCaseUnexpectedIds)) * 32
                        Items: =FirstN(LastN(colCaseUnexpectedIds, Max(0, CountRows(colCaseUnexpectedIds) - (varCaseUnexpectedPage - 1) * 10)), 10)
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: =32
                        Visible: =clip01_lblCaseUnexpectedHeading.Visible
                        Width: =If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48)
                        X: =24
                        Y: =clip01_lblCaseUnexpectedHeading.Y + clip01_lblCaseUnexpectedHeading.Height + 2
                      Children:
                        - clip01_lblCaseUnexpectedRow:
                            Control: Label
                            Properties:
                              Color: =RGBA(42, 57, 75, 1)
                              Font: =Font.'Segoe UI'
                              Height: =28
                              Size: =14
                              Text: =First(Split(ThisItem.Value, Char(9))).Value
                              Width: =Parent.TemplateWidth - 8
                              X: =4
                  - clip01_lblCaseFailure:
                      Control: Label
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(163, 38, 45, 1)
                        Font: =Font.'Segoe UI'
                        Height: =30
                        Text: =varEvidenceCase.停止理由
                        Visible: =!IsBlank(varEvidenceCase.停止理由)
                        Width: =If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48)
                        X: =24
                        Y: =If(clip01_lblCaseUnexpectedHeading.Visible, clip01_galCaseUnexpected.Y + clip01_galCaseUnexpected.Height + If(CountRows(colCaseUnexpectedIds) > 10, 50, 8), clip01_lblCaseMissingHeading.Visible, clip01_galCaseMqResults.Y + clip01_galCaseMqResults.Height + If(CountRows(colCaseMissingIds) > 10, 50, 8), clip01_lblCaseMissingHeading.Y)
                  - clip01_lblCaseReviewStatus:
                      Control: Label
                      Properties:
                        Color: =RGBA(42, 57, 75, 1)
                        Font: =Font.'Segoe UI'
                        Height: =28
                        Text: =Switch(varEvidenceCase.レビュー状態, "依頼中", "レビュー待ち", "再依頼", "レビュー待ち", "確認済み", "レビュー完了", "差し戻し", "差し戻し", Coalesce(varEvidenceCase.レビュー状態, ""))
                        Visible: =!IsBlank(varEvidenceCase.レビュー状態) && varEvidenceCase.レビュー状態 <> "未依頼"
                        Width: =If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48)
                        X: =If(Parent.Width >= 900, Parent.Width / 2 + 12, 24)
                        Y: =If(clip01_btnCaseRequestReview.Visible, clip01_lblCaseRequestHelp.Y + clip01_lblCaseRequestHelp.Height + 12, If(clip01_txtCaseComment.Visible, clip01_txtCaseComment.Y + clip01_txtCaseComment.Height + 12, detailAssigneeComment.Y + detailAssigneeComment.Height + 12))
                  - clip01_lblCaseJudgmentHeading:
                      Control: Label
                      Properties:
                        Color: =RGBA(25, 54, 92, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =26
                        Size: =16
                        Text: ="担当者の判断"
                        Width: =If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48)
                        X: =If(Parent.Width >= 900, Parent.Width / 2 + 12, 24)
                        Y: =If(clip01_lnkCaseEvidenceExcel_1.Visible, clip01_lnkCaseEvidenceExcel_1.Y + clip01_lnkCaseEvidenceExcel_1.Height + 8, clip01_lnkCaseEvidenceExcel.Y + clip01_lnkCaseEvidenceExcel.Height + 8)
                  - clip01_radCaseJudgment:
                      Control: ModernRadio
                      Properties:
                        AccessibleLabel: ="担当者の判断"
                        Default: |-
                          =If(varEvidenceCase.処理状態 = "転記済み" && varEvidenceCase.Excel反映確認 = "全文一致" && !IsBlank(varEvidenceCase.処理結果判断), {Value: Switch(varEvidenceCase.処理結果判断, "正常", "問題なし", "異常", "要対応", "判断保留", "判断保留", Coalesce(varEvidenceCase.処理結果判断, "未記録"))}, Blank())
                        DisplayMode: =If(varCaseRequestConfirm || varCaseRequestBusy || varDetailReviewBusy, DisplayMode.Disabled, If(CountIf('件別ファイル', 対象件.架空ログ証跡件 = varEvidenceCase.架空ログ証跡件) = 2 && varEvidenceCase.処理状態 = "転記済み" && varEvidenceCase.Excel反映確認 = "全文一致" && varEvidenceCase.レビュー状態 <> "依頼中" && varEvidenceCase.レビュー状態 <> "再依頼" && varEvidenceCase.レビュー状態 <> "確認済み", DisplayMode.Edit, DisplayMode.Disabled))
                        Height: =32
                        Items: =["問題なし", "要対応", "判断保留"]
                        Layout: =OptionLayout.Horizontal
                        OnChange: =Set(varCaseEditsPending, true)
                        Visible: =IsBlank(varEvidenceCase.レビュー状態) || varEvidenceCase.レビュー状態 = "未依頼" || varEvidenceCase.レビュー状態 = "差し戻し"
                        Width: =If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48)
                        X: =If(Parent.Width >= 900, Parent.Width / 2 + 12, 24)
                        Y: =clip01_lblCaseJudgmentHeading.Y + 26
                  - clip01_lblCaseCommentHeading:
                      Control: Label
                      Properties:
                        Color: =RGBA(25, 54, 92, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =26
                        Size: =16
                        Text: ="コメント"
                        Width: =If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48)
                        X: =If(Parent.Width >= 900, Parent.Width / 2 + 12, 24)
                        Y: =If(clip01_radCaseJudgment.Visible, clip01_radCaseJudgment.Y + clip01_radCaseJudgment.Height + 4, detailAssigneeValue.Y + detailAssigneeValue.Height + 8)
                  - clip01_txtCaseComment:
                      Control: ModernTextInput
                      Properties:
