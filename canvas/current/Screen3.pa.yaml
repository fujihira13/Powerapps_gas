                                    CountIf('件別ファイル', 対象件.架空ログ証跡件 = reviewId) = 2,
                                    With(
                                      {savedCase: Patch('架空ログ証跡件', currentCase, {レビュー状態: reviewStatus, 差し戻し理由: reviewReason})},
                                      Refresh('架空ログ証跡件');
                                      With(
                                        {confirmedCase: LookUp('架空ログ証跡件', 架空ログ証跡件 = reviewId)},
                                        If(
                                          savedCase.架空ログ証跡件 = reviewId && confirmedCase.架空ログ証跡件 = reviewId &&
                                          confirmedCase.レビュー状態 = reviewStatus &&
                                          Coalesce(confirmedCase.差し戻し理由, "") = Coalesce(reviewReason, ""),
                                          Set(varEvidenceCase, confirmedCase); Reset(detailReviewDecision); Reset(detailReviewReason); Reset(clip01_radCaseJudgment); Reset(clip01_txtCaseComment),
                                          Set(varDetailReviewError, "レビュー結果の保存を確認できません。進捗一覧から開き直して状態を確認してください。")
                                        )
                                      )
                                    ),
                                    Set(varEvidenceCase, currentCase);
                                    Set(varDetailReviewError, "表示中に状態が変わりました。進捗一覧から開き直して確認してください。")
                                  )
                                ),
                                Set(varDetailReviewError, "レビュー結果の保存を確認できません。進捗一覧から開き直して状態を確認してください。")
                              )
                            );
                            Set(varDetailReviewBusy, false)
                          )
                        Text: =If(varDetailReviewBusy, "保存中…", "レビューを完了")
                        Visible: =varEvidenceCase.レビュー状態 = "依頼中" || varEvidenceCase.レビュー状態 = "再依頼"
                        Width: =Min(200, If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48))
                        X: =If(Parent.Width >= 900, Parent.Width / 2 + 12, 24)
                        Y: =If(detailReviewReason.Visible, detailReviewReason.Y + detailReviewReason.Height + 12, detailReviewDecision.Y + detailReviewDecision.Height + 12)
                  - detailReviewError:
                      Control: Label
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(163, 38, 45, 1)
                        Font: =Font.'Segoe UI'
                        Height: =28
                        Size: =14
                        Text: =varDetailReviewError
                        Visible: =!IsBlank(varDetailReviewError)
                        Width: =If(Parent.Width >= 900, (Parent.Width - 72) / 2, Parent.Width - 48)
                        X: =If(Parent.Width >= 900, Parent.Width / 2 + 12, 24)
                        Y: =If(detailReviewRecord.Visible, detailReviewRecord.Y + detailReviewRecord.Height + 4, If(detailReviewSavedReason.Visible, detailReviewSavedReason.Y + detailReviewSavedReason.Height + 4, If(detailReviewSavedResult.Visible, detailReviewSavedResult.Y + detailReviewSavedResult.Height + 4, clip01_lblCaseReviewStatus.Y + clip01_lblCaseReviewStatus.Height + 4)))
      - clip01_rectCaseRequestOverlay:
