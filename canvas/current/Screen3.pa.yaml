      - clip01_btnCaseRequestSend:
          Control: Button
          Properties:
            AccessibleLabel: ="依頼する"
            Appearance: ='ButtonCanvas.Appearance'.Primary
            DisplayMode: =If(!varCaseRequestBusy && varCaseConfirmId = varEvidenceCase.架空ログ証跡件, DisplayMode.Edit, DisplayMode.Disabled)
            Height: =36
            OnSelect: |-
              =If(
                varCaseRequestConfirm && varCaseConfirmId = varEvidenceCase.架空ログ証跡件 &&
                !varCaseRequestBusy &&
                IsBlank(varCaseRequestError) &&
                CountIf('件別ファイル', 対象件.架空ログ証跡件 = varEvidenceCase.架空ログ証跡件) = 2 &&
                varEvidenceCase.処理状態 = "転記済み" &&
                varEvidenceCase.Excel反映確認 = "全文一致" &&
                !IsBlank(clip01_radCaseJudgment.Selected.Value) &&
                (clip01_radCaseJudgment.Selected.Value = "問題なし" || !IsBlank(Trim(clip01_txtCaseComment.Text))) &&
                (IsBlank(varEvidenceCase.レビュー状態) || varEvidenceCase.レビュー状態 = "未依頼" || varEvidenceCase.レビュー状態 = "差し戻し"),
                Set(varCaseRequestConfirm, false);
                Set(varCaseRequestBusy, true);
                Set(varCaseRequestError, "");
                With(
                  {
                    savedCase: IfError(
                      Patch(
                        '架空ログ証跡件',
                        varEvidenceCase,
                        {
                          処理結果判断: Switch(clip01_radCaseJudgment.Selected.Value, "問題なし", "正常", "要対応", "異常", "判断保留", "判断保留", Blank()),
                          担当者コメント: clip01_txtCaseComment.Text,
                          レビュー状態: If(varEvidenceCase.レビュー状態 = "差し戻し", "再依頼", "依頼中")
                        }
                      ),
                      Blank()
                    )
                  },
                  If(
                    !IsBlank(savedCase.架空ログ証跡件),
                    Refresh('架空ログ証跡件');
                    Set(varCaseRequestSavedId, savedCase.架空ログ証跡件);
                    With(
                      {confirmedCase: LookUp('架空ログ証跡件', 架空ログ証跡件 = varCaseRequestSavedId)},
                      If(
                        confirmedCase.処理結果判断 = Switch(clip01_radCaseJudgment.Selected.Value, "問題なし", "正常", "要対応", "異常", "判断保留", "判断保留", Blank()) &&
                        Coalesce(confirmedCase.担当者コメント, "") = Coalesce(clip01_txtCaseComment.Text, "") &&
                        confirmedCase.レビュー状態 = If(varEvidenceCase.レビュー状態 = "差し戻し", "再依頼", "依頼中"),
                        Set(varEvidenceCase, confirmedCase);
                        Set(varCaseEditsPending, false);
                        Set(varCaseReturnNeedsSave, false);
                        Navigate(Screen2, ScreenTransition.None),
                        Set(varCaseRequestError, "依頼の保存結果を確認できません。進捗一覧で状態を確認してください。")
                      )
                    ),
                    Set(varCaseRequestError, "依頼の保存結果を確認できません。進捗一覧で状態を確認してください。")
                  )
                );
                Set(varCaseRequestBusy, false)
              )
            Text: ="依頼する"
            Visible: =varCaseRequestConfirm
            Width: =102
            X: =clip01_rectCaseRequestDialog.X + (clip01_rectCaseRequestDialog.Width - 122)
            Y: =clip01_rectCaseRequestDialog.Y + (132)
