Screens:
  Screen2:
    Properties:
      Fill: =RGBA(243, 246, 250, 1)
      LoadingSpinnerColor: =RGBA(0, 96, 160, 1)
      OnVisible: =Refresh('架空ログ証跡件')
    Children:
      - lblS02Title:
          Control: Label
          Properties:
            Color: =RGBA(25, 54, 92, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =52
            Size: =If(Parent.Width < 360, 22, 28)
            Text: ="進捗一覧"
            Width: =Parent.Width - 224
            X: =24
            Y: =18
      - btnS02NewIntake:
          Control: Button
          Properties:
            AccessibleLabel: ="新しい件を受付"
            Appearance: ='ButtonCanvas.Appearance'.Secondary
            Height: =42
            OnSelect: |-
              =Set(varS01NewIntakeRequested, true);
              Navigate(Screen1, ScreenTransition.None)
            Text: ="新しい件を受付"
            Width: =166
            X: =Parent.Width - 190
            Y: =23
      - galS02Cases:
          Control: Gallery
          Variant: Vertical
          Properties:
            AccessibleLabel: ="処理状況の一覧"
            Height: =Parent.Height - 104
            Items: =SortByColumns('架空ログ証跡件', "modifiedon", SortOrder.Descending)
            TemplateSize: =If(Parent.Width >= 900, 324, 372)
            Width: =Parent.Width - 48
            X: =24
            Y: =82
          Children:
            - lblS02Identity:
                Control: Label
                Properties:
                  Color: =RGBA(25, 54, 92, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =72
                  Size: =12
                  Text: |-
                    =Coalesce(ThisItem.'件の表示名', "—") & " / " & If(IsBlank(ThisItem.'対象処理日'), "—", Text(ThisItem.'対象処理日', "[$-ja-JP]yyyy-mm-dd")) &
                    Char(10) & "環境: " & Coalesce(ThisItem.環境, "—") & " / サーバー: " & Coalesce(ThisItem.サーバー, "—") &
                    Char(10) & If(
                      IsBlank(ThisItem.createdon),
                      "受付日時: —",
                      "受付日時: " & Text(
                        DateAdd(
                          DateAdd(ThisItem.createdon, TimeZoneOffset(ThisItem.createdon), TimeUnit.Minutes),
                          9,
                          TimeUnit.Hours
                        ),
                        "[$-ja-JP]yyyy-mm-dd hh:mm:ss"
                      ) & " JST"
                    ) &
                    Char(10) & If(IsBlank(ThisItem.cr6cb_evidencecaseid), "件ID: —", "件ID: " & Text(ThisItem.cr6cb_evidencecaseid))
                  Width: =Parent.TemplateWidth - 32
                  X: =16
                  Y: =8
            - lblS02Processing:
                Control: Label
                Properties:
                  Color: =RGBA(42, 57, 75, 1)
                  Font: =Font.'Segoe UI'
                  Height: =30
                  Text: |-
                    ="ログ保存: " & If(
                      !IsBlank(ThisItem.cr6cb_evidencecaseid),
                      Switch(ThisItem.cr6cb_processingstatus, "保存済み", "保存済み", "取消", "保存済み", "開始受付済み", "保存済み", "処理中", "保存済み", "停止", "保存済み", "結果不明", "保存済み", "転記済み", "保存済み", "要確認"),
                      "要確認"
                    ) & "　　転記処理: " & Switch(ThisItem.cr6cb_processingstatus, "保存済み", "未処理", "取消", "未処理", "開始受付済み", "処理中", "処理中", "処理中", "停止", "停止", "結果不明", "要確認", "転記済み", "処理完了", "未処理") & "　　Excel実反映: " & If(ThisItem.cr6cb_processingstatus = "転記済み" && ThisItem.cr6cb_excelcheckstatus = "全文一致", "反映確認済み", Coalesce(If(ThisItem.cr6cb_processingstatus = "転記済み", ThisItem.cr6cb_excelcheckstatus, Blank()), "未確認"))
                  Width: =Parent.TemplateWidth - 32
                  X: =16
                  Y: =86
            - lblS02HumanChecks:
                Control: Label
                Properties:
                  Color: =RGBA(42, 57, 75, 1)
                  Font: =Font.'Segoe UI'
                  Height: =28
                  Text: |-
                    =With(
                      {canShowHumanDecision: ThisItem.cr6cb_processingstatus = "転記済み" && ThisItem.cr6cb_excelcheckstatus = "全文一致"},
                      "転記照合: " & If(canShowHumanDecision, Coalesce(ThisItem.cr6cb_transfercheck, "—"), "—") & "　　処理結果の判断: " & If(canShowHumanDecision, Coalesce(ThisItem.cr6cb_outcomejudgment, "—"), "—") & "　　レビュー: " & Coalesce(ThisItem.cr6cb_reviewstatus, "未依頼")
                    )
                  Width: =Parent.TemplateWidth - 32
                  X: =16
                  Y: =118
            - lblS02MqSummary:
                Control: Label
                Properties:
                  Color: =RGBA(42, 57, 75, 1)
                  Font: =Font.'Segoe UI'
                  Height: =48
                  Size: =12
                  Text: |-
                    =If(
                      CountIf(ThisItem.Attachments, EndsWith(Lower(DisplayName), ".xlsx")) = 0,
                      "MQ照合: 対象外（ログのみ）",
                      "MQ照合: " & If(ThisItem.cr6cb_mqterminalstatus = "なし", "ログ不完全・要確認", Coalesce(ThisItem.cr6cb_mqcomparisonstatus, "未確定")) &
                      "　終了表示: " & Coalesce(ThisItem.cr6cb_mqterminalstatus, "未確定") &
                      "　予定/記録/欠落: " & If(IsBlank(ThisItem.cr6cb_mqexpectedcount), "未確定", Text(ThisItem.cr6cb_mqexpectedcount, "0")) & "/" &
                      If(IsBlank(ThisItem.cr6cb_mqloggedcount), "未確定", Text(ThisItem.cr6cb_mqloggedcount, "0")) & "/" &
                      If(IsBlank(ThisItem.cr6cb_mqmissingcount), "未確定", Text(ThisItem.cr6cb_mqmissingcount, "0")) &
                      "　ALL SUCCESS はログ終端の表示で、全ID成功を意味しません。欠落はログ未記録・要確認として扱います"
                    )
                  Width: =Parent.TemplateWidth - 32
                  X: =16
                  Y: =148
            - lblS02Failure:
                Control: Label
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(163, 38, 45, 1)
                  Font: =Font.'Segoe UI'
                  Height: =28
                  Text: =ThisItem.cr6cb_failurereason
                  Visible: =!IsBlank(ThisItem.cr6cb_failurereason)
                  Width: =Parent.TemplateWidth - 32
                  X: =16
                  Y: =200
            - btnS02OpenCase:
                Control: Button
                Properties:
                  AccessibleLabel: ="件を確認"
                  Appearance: ='ButtonCanvas.Appearance'.Primary
                  Height: =42
                  OnSelect: =Set(varEvidenceCase, ThisItem); Navigate(Screen3, ScreenTransition.None)
                  Text: ="件を確認"
                  Width: =If(Parent.Width >= 900, 150, 128)
                  X: =16
                  Y: =258
            - btnS02OpenReview:
                Control: Button
                Properties:
                  AccessibleLabel: ="レビューを確認"
                  Appearance: ='ButtonCanvas.Appearance'.Secondary
                  DisplayMode: =If(ThisItem.cr6cb_processingstatus = "転記済み" && ThisItem.cr6cb_excelcheckstatus = "全文一致" && (ThisItem.cr6cb_reviewstatus = "依頼中" || ThisItem.cr6cb_reviewstatus = "再依頼" || ThisItem.cr6cb_reviewstatus = "差し戻し" || ThisItem.cr6cb_reviewstatus = "確認済み"), DisplayMode.Edit, DisplayMode.Disabled)
                  Height: =42
                  OnSelect: =If(ThisItem.cr6cb_processingstatus = "転記済み" && ThisItem.cr6cb_excelcheckstatus = "全文一致" && (ThisItem.cr6cb_reviewstatus = "依頼中" || ThisItem.cr6cb_reviewstatus = "再依頼" || ThisItem.cr6cb_reviewstatus = "差し戻し" || ThisItem.cr6cb_reviewstatus = "確認済み"), Set(varEvidenceCase, ThisItem); Set(varDemoRole, "担当者役"); Navigate(Screen4, ScreenTransition.None))
                  Text: ="レビューを確認"
                  Width: =If(Parent.Width >= 900, 170, 138)
                  X: =If(Parent.Width >= 900, 178, 158)
                  Y: =258
            - btnS02BackIntake:
                Control: Button
                Properties:
                  AccessibleLabel: ="受付へ戻る"
                  Appearance: ='ButtonCanvas.Appearance'.Secondary
                  DisplayMode: =If(ThisItem.cr6cb_processingstatus = "保存済み" && !IsBlank(ThisItem.cr6cb_failurereason), DisplayMode.Edit, DisplayMode.Disabled)
                  Height: =42
                  OnSelect: =Set(varS01NewIntakeRequested, true); Navigate(Screen1, ScreenTransition.None)
                  Text: ="受付へ戻る"
                  Visible: =ThisItem.cr6cb_processingstatus = "保存済み" && !IsBlank(ThisItem.cr6cb_failurereason)
                  Width: =If(Parent.Width >= 900, 150, 160)
                  X: =If(Parent.Width >= 900, 362, 16)
                  Y: =If(Parent.Width >= 900, 258, 306)
            - btnS02ResumeSavedCase:
                Control: Button
                Properties:
                  AccessibleLabel: ="処理開始へ戻る"
                  Appearance: ='ButtonCanvas.Appearance'.Secondary
                  DisplayMode: =If(ThisItem.cr6cb_processingstatus = "保存済み" && IsBlank(ThisItem.cr6cb_failurereason), DisplayMode.Edit, DisplayMode.Disabled)
                  Height: =42
                  OnSelect: =Set(varT001Saved, ThisItem); Navigate(Screen1, ScreenTransition.None)
                  Text: ="処理開始へ戻る"
                  Visible: =ThisItem.cr6cb_processingstatus = "保存済み" && IsBlank(ThisItem.cr6cb_failurereason)
                  Width: =If(Parent.Width >= 900, 180, 170)
                  X: =If(Parent.Width >= 900, 528, 16)
                  Y: =If(Parent.Width >= 900, 258, 306)
