      - btnS01Progress:
          Control: Button
          Properties:
            AccessibleLabel: =If(varS01DuplicateWarning, "同名警告を閉じて入力を修正する", "進捗一覧を開く")
            Appearance: ='ButtonCanvas.Appearance'.Secondary
            Height: =40
            OnSelect: =If(varS01DuplicateWarning, Set(varS01DuplicateWarning, false); Set(varS01LegacyExcelUnverified, false); Clear(colS01DuplicateCases), Navigate(Screen2, ScreenTransition.None))
            Text: =If(varS01DuplicateWarning, "修正する", "進捗一覧")
            Width: =150
