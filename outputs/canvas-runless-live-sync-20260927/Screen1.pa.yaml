      - btnT001Save:
          Control: Button
          Properties:
            AccessibleLabel: ="この1件を保存"
            DisplayMode: |-
              =With(
                {
                  logCount:CountIf(DataCardValue5.Attachments As file, EndsWith(Lower(file.Name), ".txt")),
                  bookCount:CountIf(DataCardValue5.Attachments As file, EndsWith(Lower(file.Name), ".xlsx")),
                  unsupportedCount:CountIf(DataCardValue5.Attachments As file, !EndsWith(Lower(file.Name), ".txt") && !EndsWith(Lower(file.Name), ".xlsx")),
                  attachmentCount:CountRows(DataCardValue5.Attachments)
                },
                If(varT001Saving || Coalesce(varT001SaveUnknown, false) || !IsBlank(varT001Saved.cr6cb_evidencecaseid) || Coalesce(varS01Starting, false) || Coalesce(varS01StartUnknown, false) || Coalesce(varS01DuplicateWarning, false) || !Form1.Valid || logCount <> 1 || bookCount > 1 || unsupportedCount > 0 || attachmentCount <> logCount + bookCount || IsBlank(DataCardValue2.Selected.Value) || IsBlank(DataCardValue3.Selected.Value) || IsBlank(DateValue1.SelectedDate), DisplayMode.Disabled, DisplayMode.Edit)
              )
            Height: =44
            OnSelect: |-
              =If(
                !varT001Saving &&
                !Coalesce(varT001SaveUnknown, false) &&
                IsBlank(varT001Saved.cr6cb_evidencecaseid) &&
                !Coalesce(varS01Starting, false) &&
                !Coalesce(varS01StartUnknown, false) &&
                !Coalesce(varS01DuplicateWarning, false),
                With(
                  {
                    logCount:CountIf(DataCardValue5.Attachments As file, EndsWith(Lower(file.Name), ".txt")),
                    bookCount:CountIf(DataCardValue5.Attachments As file, EndsWith(Lower(file.Name), ".xlsx")),
                    unsupportedCount:CountIf(DataCardValue5.Attachments As file, !EndsWith(Lower(file.Name), ".txt") && !EndsWith(Lower(file.Name), ".xlsx")),
                    attachmentCount:CountRows(DataCardValue5.Attachments)
                  },
                  If(
                    logCount = 1 && bookCount <= 1 && unsupportedCount = 0 && attachmentCount = logCount + bookCount &&
                    Form1.Valid && !IsBlank(DataCardValue2.Selected.Value) && !IsBlank(DataCardValue3.Selected.Value) && !IsBlank(DateValue1.SelectedDate),
                    Set(varT001Saving, true);
                    Set(varT001SavingLogName, LookUp(DataCardValue5.Attachments As file, EndsWith(Lower(file.Name), ".txt")).Name);
                    Set(varT001SavingWorkbookName, Coalesce(LookUp(DataCardValue5.Attachments As file, EndsWith(Lower(file.Name), ".xlsx")).Name, ""));
                    Set(varT001SavingEnvironment, DataCardValue2.Selected.Value);
                    Set(varT001SavingServer, DataCardValue3.Selected.Value);
                    Set(varT001SavingTargetDate, DateValue1.SelectedDate);
                    Set(varS01LegacyExcelUnverified, false);
                    Set(varS01LegacyNote, Blank());
                    Set(varS01LegacyCase, Blank());
                    Clear(colS01DuplicateCases);
                    Set(varS01DuplicateReadOk, true);
                    IfError(Refresh('架空ログ証跡件'), Set(varS01DuplicateReadOk, false));
                    If(
                      varS01DuplicateReadOk,
                      IfError(Set(varS01DuplicateLogCase, LookUp('架空ログ証跡件', cr6cb_caselabel = varT001SavingLogName)), Set(varS01DuplicateReadOk, false));
                      If(
                        !IsBlank(varS01DuplicateLogCase.cr6cb_evidencecaseid),
                        Collect(colS01DuplicateCases, {EvidenceCaseId:varS01DuplicateLogCase.cr6cb_evidencecaseid, CreatedOn:varS01DuplicateLogCase.createdon, MatchType:"ログ名", MatchName:varT001SavingLogName})
                      );
                      If(
                        !IsBlank(varT001SavingWorkbookName),
                        IfError(
                          Refresh('メモ ');
                          Set(varS01LegacyNote, LookUp('メモ ', 'ファイル名' = varT001SavingWorkbookName));
                          If(
                            !IsBlank(varS01LegacyNote),
                            If(
                              IsType(varS01LegacyNote.'関連', [@'架空ログ証跡件']),
                              Set(varS01LegacyCase, LookUp('架空ログ証跡件', cr6cb_evidencecaseid = AsType(varS01LegacyNote.'関連', [@'架空ログ証跡件']).cr6cb_evidencecaseid));
                              If(
                                IsBlank(varS01LegacyCase.cr6cb_batchfilename) && varS01LegacyCase.createdon <= DateTimeValue("2026-09-27T04:00:00Z"),
                                Collect(colS01DuplicateCases, {EvidenceCaseId:varS01LegacyCase.cr6cb_evidencecaseid, CreatedOn:varS01LegacyCase.createdon, MatchType:"Excel添付名", MatchName:varT001SavingWorkbookName})
                              ),
                              Set(varS01LegacyExcelUnverified, true)
                            )
                          ),
                          Set(varS01DuplicateReadOk, false)
                        );
                        IfError(Set(varS01DuplicateWorkbookCase, LookUp('架空ログ証跡件', cr6cb_batchfilename = varT001SavingWorkbookName)), Set(varS01DuplicateReadOk, false));
                        If(
                          !IsBlank(varS01DuplicateWorkbookCase.cr6cb_evidencecaseid),
                          With(
                            {existingMatch:LookUp(colS01DuplicateCases, EvidenceCaseId = varS01DuplicateWorkbookCase.cr6cb_evidencecaseid)},
                            If(
                              IsBlank(existingMatch.EvidenceCaseId),
                              Collect(colS01DuplicateCases, {EvidenceCaseId:varS01DuplicateWorkbookCase.cr6cb_evidencecaseid, CreatedOn:varS01DuplicateWorkbookCase.createdon, MatchType:"Excel名", MatchName:varT001SavingWorkbookName}),
                              Patch(colS01DuplicateCases, existingMatch, {MatchType:existingMatch.MatchType & "・Excel名"})
                            )
                          )
                        );
                      );
                      If(
                        !varS01DuplicateReadOk,
                        Set(varT001Saving, false);
                        Notify("過去件を確認できないため保存を止めました。再試行してください", NotificationType.Error),
                        If(
                          !IsEmpty(colS01DuplicateCases) || varS01LegacyExcelUnverified,
                          Set(varS01DuplicateWarning, true);
                          Set(varT001Saving, false);
                          Notify("同名ファイルの過去受付を表示しました。続行する場合は確認ボタンを押してください", NotificationType.Warning),
                          SubmitForm(Form1)
                        )
                      )
                    ),
                    Notify("受付には.txtログ1件と、必要な場合のみ.xlsxを1件添付してください。環境・サーバー・対象処理日も確認してください", NotificationType.Error)
                  )
                ),
                Notify("保存中または保存済みの件があります。進捗一覧で確認してください", NotificationType.Warning)
              )
            Text: ="保存"
            Width: =150
            X: =25
            Y: =Parent.Height - 72
      - btnT001CancelItem:
          Control: Button
          Properties:
            AccessibleLabel: ="同名の過去件を確認して新しい件として保存"
            Appearance: ='ButtonCanvas.Appearance'.Secondary
            DisplayMode: =If(varS01DuplicateWarning && !varT001Saving && !Coalesce(varS01Starting, false), DisplayMode.Edit, DisplayMode.Disabled)
            Height: =44
            OnSelect: |-
              =If(
                varS01DuplicateWarning && !varT001Saving && (!IsEmpty(colS01DuplicateCases) || varS01LegacyExcelUnverified) &&
                CountIf(DataCardValue5.Attachments As file, EndsWith(Lower(file.Name), ".txt")) = 1 &&
                CountIf(DataCardValue5.Attachments As file, EndsWith(Lower(file.Name), ".xlsx")) <= 1 &&
                CountIf(DataCardValue5.Attachments As file, !EndsWith(Lower(file.Name), ".txt") && !EndsWith(Lower(file.Name), ".xlsx")) = 0,
                Set(varT001Saving, true);
                Set(varS01DuplicateWarning, false);
                Set(varS01LegacyExcelUnverified, false);
                SubmitForm(Form1),
                Set(varS01DuplicateWarning, false);
                Set(varS01LegacyExcelUnverified, false);
                Clear(colS01DuplicateCases)
              )
            Text: =If(varS01LegacyExcelUnverified, "未照合を確認して新しい件として保存", "確認して新しい件として保存")
            Width: =260
            X: =185
            Y: =Parent.Height - 72
            Visible: =varS01DuplicateWarning
