Screens:
  Screen1:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =If(
          Coalesce(varS01NewIntakeRequested, false) && !varT001Saving && !Coalesce(varS01Starting, false) && !Coalesce(varS01StartUnknown, false),
          Set(varS01NewIntakeRequested, false);
          Set(varT001Saved, Blank());
          Set(varEvidenceCase, Blank());
          Set(varT001SaveUnknown, false);
          Set(varS01DuplicateWarning, false);
          Set(varS01FlowStatus, "");
          Clear(colS01DuplicateCases);
          ResetForm(Form1);
          NewForm(Form1)
        )
    Children:
      - Form1:
          Control: Form
          Variant: Classic
          Layout: Vertical
          Properties:
            BorderColor: =RGBA(245, 245, 245, 1)
            DataSource: ='架空ログ証跡件'
            DefaultMode: =FormMode.New
            Height: =Parent.Height - Self.Y - 155
            NumberOfColumns: =2
            OnFailure: |-
              =Set(varT001Saving, false);
              Set(varT001SaveUnknown, true);
              Set(varS01FlowStatus, "保存結果を確認できません。進捗一覧で状態を確認してください。");
              Notify("保存結果を確認できません。再保存せず進捗一覧で状態を確認してください", NotificationType.Error)
            OnSuccess: |-
              =Set(varT001SubmittedCaseId, Form1.LastSubmit.cr6cb_evidencecaseid);
              Set(varT001SaveVerified, false);
              Set(varT001ReadbackRefreshOk, true);
              IfError(Refresh('架空ログ証跡件'), Set(varT001ReadbackRefreshOk, false));
              If(
                varT001ReadbackRefreshOk,
                Set(varT001ReadbackCase, IfError(LookUp('架空ログ証跡件', cr6cb_evidencecaseid = varT001SubmittedCaseId), Blank()));
                If(
                  !IsBlank(varT001ReadbackCase.cr6cb_evidencecaseid),
                  Set(varT001StatusPatch, Blank());
                  IfError(
                    Set(varT001StatusPatch, Patch('架空ログ証跡件', varT001ReadbackCase, {cr6cb_processingstatus:"保存済み", cr6cb_excelcheckstatus:"未確認", cr6cb_reviewstatus:"未依頼", cr6cb_batchfilename:If(IsBlank(varT001SavingWorkbookName), Blank(), varT001SavingWorkbookName)})),
                    Set(varT001StatusPatch, Blank())
                  );
                  If(
                    !IsBlank(varT001StatusPatch.cr6cb_evidencecaseid),
                    Set(varT001ReadbackRefreshOk, true);
                    IfError(Refresh('架空ログ証跡件'), Set(varT001ReadbackRefreshOk, false));
                    Set(varT001ReadbackCase, IfError(LookUp('架空ログ証跡件', cr6cb_evidencecaseid = varT001SubmittedCaseId), Blank()));
                    If(
                      varT001ReadbackRefreshOk &&
                      !IsBlank(varT001ReadbackCase.cr6cb_evidencecaseid) &&
                      !IsBlank(varT001ReadbackCase.createdon) &&
                      varT001ReadbackCase.cr6cb_evidencecaseid = varT001SubmittedCaseId &&
                      varT001ReadbackCase.cr6cb_caselabel = varT001SavingLogName &&
                      varT001ReadbackCase.cr6cb_environment = varT001SavingEnvironment &&
                      varT001ReadbackCase.cr6cb_server = varT001SavingServer &&
                      DateValue(varT001ReadbackCase.cr6cb_targetdate) = DateValue(varT001SavingTargetDate) &&
                      Coalesce(varT001ReadbackCase.cr6cb_batchfilename, "") = varT001SavingWorkbookName &&
                      varT001ReadbackCase.cr6cb_processingstatus = "保存済み" &&
                      varT001ReadbackCase.cr6cb_excelcheckstatus = "未確認" &&
                      varT001ReadbackCase.cr6cb_reviewstatus = "未依頼" &&
                      CountRows(varT001ReadbackCase.Attachments) = If(IsBlank(varT001SavingWorkbookName), 1, 2) &&
                      CountIf(varT001ReadbackCase.Attachments As savedFile, savedFile.DisplayName = varT001SavingLogName) = 1 &&
                      CountIf(varT001ReadbackCase.Attachments As savedFile, savedFile.DisplayName = varT001SavingWorkbookName) = If(IsBlank(varT001SavingWorkbookName), 0, 1),
                      Set(varT001SaveVerified, true)
                    )
                  )
                )
              );
              Set(varT001Saving, false);
              If(
                varT001SaveVerified,
                Set(varT001SaveUnknown, false);
                Set(varT001Saved, varT001ReadbackCase);
                Set(varEvidenceCase, varT001ReadbackCase);
                Set(varS01FlowStatus, "保存済み");
                Set(varS01DuplicateWarning, false);
                Clear(colS01DuplicateCases);
                ResetForm(Form1);
                NewForm(Form1);
                Notify("件と添付を読み戻して保存済みを確認しました", NotificationType.Success),
                Set(varT001SaveUnknown, true);
                Set(varS01FlowStatus, "保存内容を読み戻せませんでした。進捗一覧で状態を確認してください。");
                Notify("保存後の読み戻しを確認できませんでした。再保存せず進捗一覧を確認してください", NotificationType.Error)
              )
            Width: =Parent.Width - 50
            X: =25
            Y: =lblT001MqMode.Y + lblT001MqMode.Height + 12
          Children:
            - ログ名_DataCard1:
                Control: TypedDataCard
                Variant: ClassicTextualEdit
                IsLocked: true
                Properties:
                  BorderColor: =RGBA(245, 245, 245, 1)
