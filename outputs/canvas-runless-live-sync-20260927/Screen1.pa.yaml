            Size: =9
            Text: |-
              =If(
                Coalesce(varS01StartUnknown, false) || Coalesce(varT001SaveUnknown, false),
                Coalesce(varS01FlowStatus, "保存または開始の状態を確認してください"),
                !IsBlank(varT001Saved.cr6cb_evidencecaseid),
                "保存済み / 受付 " & Text(DateAdd(varT001Saved.createdon, TimeZoneOffset(varT001Saved.createdon) + 540, TimeUnit.Minutes), "[$-ja-JP]yyyy-mm-dd HH:mm") & " JST / 件ID " & Text(varT001Saved.cr6cb_evidencecaseid) & "。別操作の「処理開始」を押してください。",
                Coalesce(varS01FlowStatus, "環境・サーバー・対象処理日を確認して保存してください")
              )
            Width: =Parent.Width - 50
            X: =25
