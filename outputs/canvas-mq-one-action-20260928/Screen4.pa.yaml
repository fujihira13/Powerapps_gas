Screens:
  Screen4:
    Properties:
      Fill: =RGBA(243, 246, 250, 1)
      LoadingSpinnerColor: =RGBA(0, 96, 160, 1)
      OnVisible: =Refresh('件別ファイル'); Reset(radReviewResult); Reset(txtReviewReason)
    Children:
      - lblReviewTitle:
          Control: Label
          Properties:
            Color: =RGBA(25, 54, 92, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =52
            Size: =28
            Text: ="レビュー"
            Width: =Min(Parent.Width - 48, 960)
            X: =Max(24, (Parent.Width - 960) / 2)
            Y: =18
      - lblReviewIdentity:
          Control: Label
          Properties:
            Color: =RGBA(42, 57, 75, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =88
            Size: =14
            Text: |-
              =Coalesce(varEvidenceCase.cr6cb_caselabel, "—") & " / " & If(IsBlank(varEvidenceCase.cr6cb_targetdate), "—", Text(varEvidenceCase.cr6cb_targetdate, "[$-ja-JP]yyyy-mm-dd")) &
              Char(10) & "環境: " & Substitute(Coalesce(varEvidenceCase.cr6cb_environment, "—"), "架空", "") & " / サーバー: " & Substitute(Coalesce(varEvidenceCase.cr6cb_server, "—"), "架空", "") &
              Char(10) & If(
                IsBlank(varEvidenceCase.createdon),
                "受付日時: —",
                "受付日時: " & Text(
                  DateAdd(
                    DateAdd(varEvidenceCase.createdon, TimeZoneOffset(varEvidenceCase.createdon), TimeUnit.Minutes),
                    9,
                    TimeUnit.Hours
                  ),
                  "[$-ja-JP]yyyy-mm-dd hh:mm:ss"
                ) & " JST"
              ) &
              Char(10) & If(IsBlank(varEvidenceCase.cr6cb_evidencecaseid), "件ID: —", "件ID: " & Text(varEvidenceCase.cr6cb_evidencecaseid))
            Width: =Min(Parent.Width - 48, 960)
            X: =Max(24, (Parent.Width - 960) / 2)
            Y: =72
      - lblReviewAssigneeHeading:
          Control: Label
          Properties:
            Color: =RGBA(25, 54, 92, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =18
            Text: ="担当者の確認"
            Width: =Min(Parent.Width - 48, 960)
            X: =Max(24, (Parent.Width - 960) / 2)
            Y: =lblReviewIdentity.Y + lblReviewIdentity.Height + 14
      - lblReviewTransferCheck:
          Control: Label
          Properties:
            Color: =RGBA(42, 57, 75, 1)
            Font: =Font.'Segoe UI'
            Height: =28
            Text: |-
              ="転記内容の照合: " & Coalesce(varEvidenceCase.cr6cb_transfercheck, "—")
            Width: =Min(Parent.Width - 48, 960)
            X: =Max(24, (Parent.Width - 960) / 2)
            Y: =lblReviewAssigneeHeading.Y + lblReviewAssigneeHeading.Height + 8
      - lblReviewOutcome:
          Control: Label
          Properties:
            Color: =RGBA(42, 57, 75, 1)
            Font: =Font.'Segoe UI'
            Height: =28
            Text: |-
              ="処理結果の判断: " & Coalesce(varEvidenceCase.cr6cb_outcomejudgment, "—")
            Width: =Min(Parent.Width - 48, 960)
            X: =Max(24, (Parent.Width - 960) / 2)
            Y: =lblReviewTransferCheck.Y + lblReviewTransferCheck.Height + 4
      - lblReviewComment:
          Control: Label
          Properties:
            AutoHeight: =true
            Color: =RGBA(42, 57, 75, 1)
            Font: =Font.'Segoe UI'
            Height: =28
            Text: |-
              ="コメント: " & Coalesce(varEvidenceCase.cr6cb_reviewcomment, "—")
            Width: =Min(Parent.Width - 48, 960)
            X: =Max(24, (Parent.Width - 960) / 2)
            Y: =lblReviewOutcome.Y + lblReviewOutcome.Height + 4
      - lblReviewRequestStatus:
          Control: Label
          Properties:
            Color: =RGBA(42, 57, 75, 1)
            Font: =Font.'Segoe UI'
            Height: =28
            Text: |-
              ="レビュー依頼状態: " & Coalesce(varEvidenceCase.cr6cb_reviewstatus, "—")
            Width: =Min(Parent.Width - 48, 960)
            X: =Max(24, (Parent.Width - 960) / 2)
            Y: =lblReviewComment.Y + lblReviewComment.Height + 8
      - lblReviewResultStatus:
          Control: Label
          Properties:
            Color: =RGBA(42, 57, 75, 1)
            Font: =Font.'Segoe UI'
            Height: =28
            Text: |-
              ="記録済みの結果: " & If(varEvidenceCase.cr6cb_reviewstatus = "確認済み" || varEvidenceCase.cr6cb_reviewstatus = "差し戻し", varEvidenceCase.cr6cb_reviewstatus, "—")
            Width: =Min(Parent.Width - 48, 960)
            X: =Max(24, (Parent.Width - 960) / 2)
            Y: =lblReviewRequestStatus.Y + lblReviewRequestStatus.Height + 4
      - lblReviewReturnReason:
          Control: Label
          Properties:
            AutoHeight: =true
            Color: =RGBA(163, 38, 45, 1)
            Font: =Font.'Segoe UI'
            Height: =28
            Text: |-
              ="差し戻し理由: " & varEvidenceCase.cr6cb_reviewreason
            Visible: =!IsBlank(varEvidenceCase.cr6cb_reviewreason)
            Width: =Min(Parent.Width - 48, 960)
            X: =Max(24, (Parent.Width - 960) / 2)
            Y: =lblReviewResultStatus.Y + lblReviewResultStatus.Height + 4
      - lblReviewRole:
          Control: Label
          Properties:
            Color: =RGBA(42, 57, 75, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Text: |-
              ="実演上の役割: " & varDemoRole
            Width: =Min(Parent.Width - 48, 960)
            X: =Max(24, (Parent.Width - 960) / 2)
            Y: =If(lblReviewReturnReason.Visible, lblReviewReturnReason.Y + lblReviewReturnReason.Height + 8, lblReviewResultStatus.Y + lblReviewResultStatus.Height + 10)
      - btnReviewSwitchRole:
          Control: Button
          Properties:
            AccessibleLabel: ="レビュアー役に切り替える"
            Appearance: ='ButtonCanvas.Appearance'.Secondary
            DisplayMode: =If(CountIf('件別ファイル', cr6cb_evidencecase.cr6cb_evidencecaseid = varEvidenceCase.cr6cb_evidencecaseid) = 2 && (varEvidenceCase.cr6cb_reviewstatus = "依頼中" || varEvidenceCase.cr6cb_reviewstatus = "再依頼") && varDemoRole <> "レビュアー役", DisplayMode.Edit, DisplayMode.Disabled)
            Height: =42
            OnSelect: =Set(varDemoRole, "レビュアー役")
            Text: ="レビュアー役に切り替える"
            Width: =260
            X: =Max(24, (Parent.Width - 960) / 2)
            Y: =lblReviewRole.Y + lblReviewRole.Height + 4
      - lblReviewResultHeading:
          Control: Label
          Properties:
            Color: =RGBA(25, 54, 92, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =16
            Text: ="レビュー結果"
            Width: =Min(Parent.Width - 48, 960)
            X: =Max(24, (Parent.Width - 960) / 2)
            Y: =btnReviewSwitchRole.Y + btnReviewSwitchRole.Height + 12
      - radReviewResult:
          Control: ModernRadio
          Properties:
            AccessibleLabel: ="レビュー結果"
            Default: =Blank()
            DisplayMode: =If(varDemoRole = "レビュアー役" && CountIf('件別ファイル', cr6cb_evidencecase.cr6cb_evidencecaseid = varEvidenceCase.cr6cb_evidencecaseid) = 2 && (varEvidenceCase.cr6cb_reviewstatus = "依頼中" || varEvidenceCase.cr6cb_reviewstatus = "再依頼"), DisplayMode.Edit, DisplayMode.Disabled)
            Height: =44
            Items: =["確認済み", "差し戻し"]
            Layout: =OptionLayout.Horizontal
            Width: =Min(Parent.Width - 48, 960)
            X: =Max(24, (Parent.Width - 960) / 2)
            Y: =lblReviewResultHeading.Y + lblReviewResultHeading.Height + 2
      - lblReviewReasonHeading:
          Control: Label
          Properties:
            Color: =RGBA(25, 54, 92, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =26
            Size: =16
            Text: ="差し戻し理由"
            Width: =Min(Parent.Width - 48, 960)
            X: =Max(24, (Parent.Width - 960) / 2)
            Y: =radReviewResult.Y + radReviewResult.Height + 6
      - txtReviewReason:
          Control: ModernTextInput
          Properties:
            AccessibleLabel: ="差し戻し理由"
            DisplayMode: =If(varDemoRole = "レビュアー役" && CountIf('件別ファイル', cr6cb_evidencecase.cr6cb_evidencecaseid = varEvidenceCase.cr6cb_evidencecaseid) = 2 && (varEvidenceCase.cr6cb_reviewstatus = "依頼中" || varEvidenceCase.cr6cb_reviewstatus = "再依頼"), DisplayMode.Edit, DisplayMode.Disabled)
            Height: =62
            Required: =radReviewResult.Selected.Value = "差し戻し"
            Type: =TextInputType.Multiline
            Width: =Min(Parent.Width - 48, 960)
            X: =Max(24, (Parent.Width - 960) / 2)
            Y: =lblReviewReasonHeading.Y + lblReviewReasonHeading.Height + 2
      - btnReviewRecord:
          Control: Button
          Properties:
            AccessibleLabel: ="レビュー結果を記録"
            Appearance: ='ButtonCanvas.Appearance'.Primary
            DisplayMode: =If(varDemoRole = "レビュアー役" && CountIf('件別ファイル', cr6cb_evidencecase.cr6cb_evidencecaseid = varEvidenceCase.cr6cb_evidencecaseid) = 2 && (varEvidenceCase.cr6cb_reviewstatus = "依頼中" || varEvidenceCase.cr6cb_reviewstatus = "再依頼") && !IsBlank(radReviewResult.Selected.Value) && (radReviewResult.Selected.Value = "確認済み" || !IsBlank(Trim(txtReviewReason.Text))), DisplayMode.Edit, DisplayMode.Disabled)
            Height: =42
            OnSelect: |-
              =If(
                varDemoRole = "レビュアー役" &&
                CountIf('件別ファイル', cr6cb_evidencecase.cr6cb_evidencecaseid = varEvidenceCase.cr6cb_evidencecaseid) = 2 &&
                (varEvidenceCase.cr6cb_reviewstatus = "依頼中" || varEvidenceCase.cr6cb_reviewstatus = "再依頼") &&
                !IsBlank(radReviewResult.Selected.Value) &&
                (radReviewResult.Selected.Value = "確認済み" || !IsBlank(Trim(txtReviewReason.Text))),
                Refresh('架空ログ証跡件');
                Set(
                  varReviewCurrentCase,
                  LookUp(
                    '架空ログ証跡件',
                    cr6cb_evidencecaseid = varEvidenceCase.cr6cb_evidencecaseid
                  )
                );
                If(
                  !IsBlank(varReviewCurrentCase.cr6cb_evidencecaseid) &&
                  varReviewCurrentCase.versionnumber = varEvidenceCase.versionnumber &&
                  (varReviewCurrentCase.cr6cb_reviewstatus = "依頼中" || varReviewCurrentCase.cr6cb_reviewstatus = "再依頼"),
                  With(
                    {
                      savedCase: IfError(
                        Patch(
                          '架空ログ証跡件',
                          varReviewCurrentCase,
                          {
                            cr6cb_reviewstatus: radReviewResult.Selected.Value,
                            cr6cb_reviewreason: If(radReviewResult.Selected.Value = "差し戻し", txtReviewReason.Text, Blank())
                          }
                        ),
                        Blank()
                      )
                    },
                    If(
                      !IsBlank(savedCase.cr6cb_evidencecaseid),
                      Set(varEvidenceCase, savedCase);
                      Set(varDemoRole, "担当者役");
                      Navigate(Screen2, ScreenTransition.None)
                    )
                  )
                )
              )
            Text: ="レビュー結果を記録"
            Width: =200
            X: =Max(24, (Parent.Width - 960) / 2)
            Y: =txtReviewReason.Y + txtReviewReason.Height + 24
      - btnReviewOpenCase:
          Control: Button
          Properties:
            AccessibleLabel: ="件の内容を確認"
            Appearance: ='ButtonCanvas.Appearance'.Secondary
            Height: =42
            OnSelect: =Navigate(Screen3, ScreenTransition.None)
            Text: ="件の内容を確認"
            Width: =180
            X: =Max(24, (Parent.Width - 960) / 2) + 216
            Y: =btnReviewRecord.Y
      - btnReviewBack:
          Control: Button
          Properties:
            AccessibleLabel: ="一覧に戻る"
            Appearance: ='ButtonCanvas.Appearance'.Secondary
            Height: =42
            OnSelect: =Set(varDemoRole, "担当者役"); Navigate(Screen2, ScreenTransition.None)
            Text: ="一覧に戻る"
            Width: =160
            X: =Max(24, (Parent.Width - 960) / 2) + 412
            Y: =btnReviewRecord.Y
