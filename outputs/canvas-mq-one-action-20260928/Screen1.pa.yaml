      - btnT001Save:
          Control: Button
          Properties:
            AccessibleLabel: ="照合を開始"
            DisplayMode: |-
              =With(
                {
                  logCount:CountRows(attS01OneLog.Attachments),
                  bookCount:CountRows(attS01OneExcel.Attachments),
                  logFile:First(attS01OneLog.Attachments),
                  bookFile:First(attS01OneExcel.Attachments)
                },
                If(varT001Saving || Coalesce(varT001SaveUnknown, false) || Coalesce(varS01Starting, false) || Coalesce(varS01StartUnknown, false) || Coalesce(varS01DuplicateWarning, false) || !Form1.Valid || logCount <> 1 || bookCount <> 1 || !EndsWith(Lower(logFile.Name), ".txt") || !EndsWith(Lower(bookFile.Name), ".xlsx") || IsBlank(DataCardValue2.Selected.Value) || IsBlank(DataCardValue3.Selected.Value) || IsBlank(DateValue1.SelectedDate), DisplayMode.Disabled, DisplayMode.Edit)
              )
            Height: =44
            OnSelect: |-
              =If(
                !varT001Saving &&
                !Coalesce(varT001SaveUnknown, false) &&
                IsBlank(varT001Saved.cr6cb_evidencecaseid) &&
                !Coalesce(varS01Starting, false) &&
                !Coalesce(varS01StartUnknown, false) &&
                !Coalesce(varS01DuplicateWarning, false),
                With(
                  {
                    logCount:CountRows(attS01OneLog.Attachments),
                    bookCount:CountRows(attS01OneExcel.Attachments),
                    logFile:First(attS01OneLog.Attachments),
                    bookFile:First(attS01OneExcel.Attachments)
                  },
                  If(
                    logCount = 1 && bookCount = 1 &&
                    EndsWith(Lower(logFile.Name), ".txt") && EndsWith(Lower(bookFile.Name), ".xlsx") &&
                    Form1.Valid && !IsBlank(DataCardValue2.Selected.Value) && !IsBlank(DataCardValue3.Selected.Value) && !IsBlank(DateValue1.SelectedDate),
                    Set(varT001Saving, true);
                    Set(varT001SaveUnknown, false);
                    Set(varS01StartUnknown, false);
                    Set(varS01DuplicateReadOk, true);
                    Set(varS01DuplicateReadFailed, false);
                    Set(varS01DuplicateLimitHit, false);
                    Set(varT001SavingLogName, logFile.Name);
                    Set(varT001SavingWorkbookName, bookFile.Name);
                    Set(varT001SavingEnvironment, DataCardValue2.Selected.Value);
                    Set(varT001SavingServer, DataCardValue3.Selected.Value);
                    Set(varT001SavingTargetDate, DateValue1.SelectedDate);
                    Clear(colS01DuplicateCases);
                    Clear(colS01DuplicateRaw);
                    Clear(colS01ParentMatches);
                    Clear(colS01ChildMatches);
                    Clear(colS01DuplicateNotes);
                    Clear(colS01LegacyNoteMatches);
                    IfError(Refresh('架空ログ証跡件'), Set(varS01DuplicateReadOk, false));
                    IfError(Refresh('件別ファイル'), Set(varS01DuplicateReadOk, false));
                    IfError(Refresh('メモ '), Set(varS01DuplicateReadOk, false));
                    If(
                      varS01DuplicateReadOk,
                      IfError(
                        ClearCollect(
                          colS01ParentMatches,
                          Filter(
                            '架空ログ証跡件',
                            cr6cb_caselabel = varT001SavingLogName ||
                            (!IsBlank(varT001SavingWorkbookName) && cr6cb_batchfilename = varT001SavingWorkbookName)
                          )
                        );
                        Set(varS01DuplicateLimitHit, CountRows(colS01ParentMatches) >= 500),
                        Set(varS01DuplicateReadOk, false)
                      );
                      IfError(
                        ClearCollect(
                          colS01ChildMatches,
                          ForAll(
                            Filter('件別ファイル', cr6cb_filename = varT001SavingLogName || cr6cb_filename = varT001SavingWorkbookName) As pastFile,
                            With(
                              {matchedParent:LookUp('架空ログ証跡件', cr6cb_evidencecaseid = pastFile.cr6cb_evidencecase.cr6cb_evidencecaseid)},
                              {
                                EvidenceCaseId:matchedParent.cr6cb_evidencecaseid,
                                CreatedOn:matchedParent.createdon,
                                MatchType:Switch(pastFile.cr6cb_filerole, "log", "ログ名", "excel", "Excel名", "ファイル名"),
                                MatchName:pastFile.cr6cb_filename
                              }
                            )
                          )
                        );
                        Set(varS01DuplicateLimitHit, varS01DuplicateLimitHit || CountRows(colS01ChildMatches) >= 500),
                        Set(varS01DuplicateReadOk, false)
                      );
                      IfError(
                        ClearCollect(colS01DuplicateNotes, Filter('メモ ', 'ファイル名' = varT001SavingWorkbookName));
                        Set(varS01DuplicateLimitHit, varS01DuplicateLimitHit || CountRows(colS01DuplicateNotes) >= 500);
                        ClearCollect(
                          colS01LegacyNoteMatches,
                          ForAll(
                            colS01DuplicateNotes As legacyNote,
                            If(
                              IsType(legacyNote.'関連', [@'架空ログ証跡件']),
                              With(
                                {matchedParent:AsType(legacyNote.'関連', [@'架空ログ証跡件'])},
                                {
                                  EvidenceCaseId:matchedParent.cr6cb_evidencecaseid,
                                  CreatedOn:matchedParent.createdon,
                                  MatchType:"旧Excel添付名",
                                  MatchName:legacyNote.'ファイル名'
                                }
                              ),
                              {
                                EvidenceCaseId:Blank(),
                                CreatedOn:Blank(),
                                MatchType:"関連件不明",
                                MatchName:legacyNote.'ファイル名'
                              }
                            )
                          )
                        ),
                        Set(varS01DuplicateReadOk, false)
                      );
                      ClearCollect(colS01DuplicateRaw, colS01ParentMatches);
                      Collect(colS01DuplicateRaw, colS01ChildMatches);
                      Collect(colS01DuplicateRaw, Filter(colS01LegacyNoteMatches, !IsBlank(EvidenceCaseId)));
                      If(
                        varS01DuplicateLimitHit ||
                        CountIf(colS01ChildMatches, IsBlank(EvidenceCaseId)) > 0 ||
                        CountIf(colS01LegacyNoteMatches, IsBlank(EvidenceCaseId)) > 0,
                        Set(varS01DuplicateReadOk, false)
                      );
                      IfError(
                        ClearCollect(
                          colS01DuplicateCases,
                          ForAll(
                            GroupBy(colS01DuplicateRaw, EvidenceCaseId, MatchRows) As groupedCase,
                            {
                              EvidenceCaseId:groupedCase.EvidenceCaseId,
                              CreatedOn:First(groupedCase.MatchRows).CreatedOn,
                              MatchType:Concat(groupedCase.MatchRows As matchedFile, matchedFile.MatchType, "・"),
                              MatchName:Concat(groupedCase.MatchRows As matchedFile, matchedFile.MatchName, " / ")
                            }
                          )
                        ),
                        Set(varS01DuplicateReadOk, false)
                      );
                      If(
                        !varS01DuplicateReadOk,
                        Set(varT001Saving, false);
                        Set(varS01DuplicateWarning, true);
                        Set(varS01DuplicateReadFailed, true);
                        Set(varS01FlowStatus, "過去件の同名照合を完了できないため受付を止めました");
                        Notify("過去件の同名照合が不完全です。保存せず進捗一覧で確認してください", NotificationType.Error),
                        If(
                          !IsEmpty(colS01DuplicateCases),
                          Set(varS01DuplicateWarning, true);
                          Set(varT001Saving, false);
                          Set(varS01DuplicateReadFailed, false);
                          Set(varS01FlowStatus, "同名候補を確認してください");
                          Notify("同名ファイルの過去受付を表示しました。続行する場合は確認ボタンを押してください", NotificationType.Warning),
                          SubmitForm(Form1)
                        )
                      ),
                      Set(varT001Saving, false);
                      Set(varS01DuplicateReadFailed, true);
                      Set(varS01FlowStatus, "過去件を照会できないため受付を止めました");
                      Notify("過去件を照会できません。保存せず後で確認してください", NotificationType.Error)
                    ),
                    Notify("受付には.txtログ1件と.xlsx更新対象一覧1冊、環境、サーバー、対象処理日が必要です", NotificationType.Error)
                  )
                ),
                Notify("保存中または保存済みの件があります。進捗一覧で確認してください", NotificationType.Warning)
              )
            Text: ="照合を開始"
            Width: =170
            X: =25
            Y: =Parent.Height - 72
      - btnT001CancelItem:
          Control: Button
          Properties:
            AccessibleLabel: ="同名の過去件を確認して新しい受付として照合を開始"
            Appearance: ='ButtonCanvas.Appearance'.Secondary
            DisplayMode: =If(varS01DuplicateWarning && varS01DuplicateReadOk && !varS01DuplicateReadFailed && !varT001Saving && !Coalesce(varS01Starting, false), DisplayMode.Edit, DisplayMode.Disabled)
            Height: =44
            OnSelect: |-
              =If(
                varS01DuplicateWarning && varS01DuplicateReadOk && !varS01DuplicateReadFailed && !varT001Saving && !IsEmpty(colS01DuplicateCases) &&
                CountRows(attS01OneLog.Attachments) = 1 &&
                CountRows(attS01OneExcel.Attachments) = 1 &&
                EndsWith(Lower(First(attS01OneLog.Attachments).Name), ".txt") &&
                EndsWith(Lower(First(attS01OneExcel.Attachments).Name), ".xlsx") &&
                Form1.Valid,
                Set(varT001Saving, true);
                Set(varS01DuplicateWarning, false);
                Set(varS01LegacyExcelUnverified, false);
                Set(varS01FlowStatus, "同名を確認しました。保存を開始します");
                SubmitForm(Form1),
                Set(varS01DuplicateWarning, false);
                Set(varS01LegacyExcelUnverified, false);
                Clear(colS01DuplicateCases)
              )
            Text: =If(varS01LegacyExcelUnverified, "注意を確認して照合を開始", "同名を確認して照合を開始")
            Visible: =varS01DuplicateWarning
            Width: =260
            X: =185
            Y: =Parent.Height - 72
      - lblT001Receipt:
          Control: Label
          Properties:
            AutoHeight: =true
            Color: =RGBA(50, 49, 48, 1)
            Live: =Live.Polite
            Text: ="受付・対象確認"
            Width: =Parent.Width - 50
            X: =25
            Y: =8
      - lblT001MqMode:
          Control: Label
          Properties:
            AutoHeight: =true
            Color: =RGBA(42, 57, 75, 1)
            Height: =90
            Size: =12
            Text: |-
              =If(
                varS01DuplicateWarning && (!IsEmpty(colS01DuplicateCases) || varS01LegacyExcelUnverified),
                If(
                  varS01LegacyExcelUnverified,
                  "過去のExcel名を個別照合できません。確認すると新しい受付として照合を開始します。" & Char(10),
                  "同名ファイルの過去受付があります。同名は内容が同一という判定ではありません。" & Char(10)
                ) &
                Concat(
                  colS01DuplicateCases As duplicateCase,
                  duplicateCase.MatchType & "「" & duplicateCase.MatchName & "」 / 受付 " &
                  Text(DateAdd(duplicateCase.CreatedOn, TimeZoneOffset(duplicateCase.CreatedOn) + 540, TimeUnit.Minutes), "[$-ja-JP]yyyy-mm-dd HH:mm") &
                  " JST / 件ID " & Text(duplicateCase.EvidenceCaseId),
                  Char(10)
                ),
                "更新対象一覧（Excel）とサーバーログ（txt）を各1件選んでください。対象処理日は当日を初期表示します。照合を開始すると、内部で2ファイルの保存を確認してから処理します。"
              )
            Width: =Parent.Width - 50
            X: =25
            Y: =52
      - btnS01Progress:
          Control: Button
          Properties:
            AccessibleLabel: =If(varS01DuplicateWarning, "同名警告を閉じて入力を修正する", "進捗一覧を開く")
            Appearance: ='ButtonCanvas.Appearance'.Secondary
            Height: =40
            OnSelect: =If(varS01DuplicateWarning, Set(varS01DuplicateWarning, false); Set(varS01LegacyExcelUnverified, false); Clear(colS01DuplicateCases), Navigate(Screen2, ScreenTransition.None))
            Text: =If(varS01DuplicateWarning, "修正する", "進捗一覧")
            Width: =150
            X: =Parent.Width - 180
            Y: =12
      - btnS01StartFlow:
          Control: Button
          Properties:
            AccessibleLabel: ="処理開始"
            Appearance: ='ButtonCanvas.Appearance'.Primary
            DisplayMode: =DisplayMode.Disabled
            Height: =44
            OnSelect: |-
              =If(
                !varT001Saving && !Coalesce(varT001SaveUnknown, false) && !Coalesce(varS01Starting, false) && !Coalesce(varS01StartUnknown, false) &&
                !IsBlank(varT001Saved.cr6cb_evidencecaseid) && varT001Saved.cr6cb_processingstatus = "保存済み",
                Set(varS01Starting, true);
                Set(varS01FlowStatus, "処理を開始しています");
                Set(varS01StartPatch, Blank());
                IfError(
                  Set(varS01StartPatch, Patch('架空ログ証跡件', varT001Saved, {cr6cb_processingstatus:"開始受付済み", cr6cb_failurereason:""})),
                  Set(varS01StartPatch, Blank())
                );
                If(
                  IsBlank(varS01StartPatch.cr6cb_evidencecaseid),
                  Set(varS01StartUnknown, true);
                  Set(varS01Starting, false);
                  Set(varS01FlowStatus, "開始状況を確認してください。進捗一覧を開いて状態を確認します"),
                  Set(varT001Saved, varS01StartPatch);
                  IfError(
                    '架空ログ証跡_件別Excel転記'.Run(Text(varT001Saved.cr6cb_evidencecaseid));
                    Refresh('架空ログ証跡件');
                    Set(varS01StartReadback, IfError(LookUp('架空ログ証跡件', cr6cb_evidencecaseid = varT001Saved.cr6cb_evidencecaseid), Blank()));
                    If(
                      !IsBlank(varS01StartReadback.cr6cb_evidencecaseid) &&
                      (varS01StartReadback.cr6cb_processingstatus = "開始受付済み" || varS01StartReadback.cr6cb_processingstatus = "受付済み" || varS01StartReadback.cr6cb_processingstatus = "処理中" || varS01StartReadback.cr6cb_processingstatus = "停止" || varS01StartReadback.cr6cb_processingstatus = "結果不明" || varS01StartReadback.cr6cb_processingstatus = "転記済み"),
                      Set(varT001Saved, varS01StartReadback);
                      Set(varS01Starting, false);
                      Set(varS01FlowStatus, "処理を開始しました");
                      Navigate(Screen2, ScreenTransition.None),
                      Set(varS01StartUnknown, true);
                      Set(varS01Starting, false);
                      Set(varS01FlowStatus, "開始結果を確認できません。進捗一覧で状態を確認してください")
                    ),
                    Set(varS01StartUnknown, true);
                    Set(varS01Starting, false);
                    Set(varS01FlowStatus, "開始結果を確認できません。進捗一覧で状態を確認してください")
                  )
                ),
                Notify("保存済みの未開始件がありません", NotificationType.Warning)
              )
            Text: ="処理開始"
            Visible: =false
            Width: =170
            X: =Parent.Width - 195
            Y: =Parent.Height - 72
      - lblS01FlowStatus:
          Control: Label
          Properties:
            Color: =RGBA(120, 75, 0, 1)
            Height: =60
            Live: =Live.Polite
            Size: =9
            Text: |-
              =If(
                Coalesce(varS01StartUnknown, false) || Coalesce(varT001SaveUnknown, false),
                Coalesce(varS01FlowStatus, "保存または開始の状態を確認してください"),
                !IsBlank(varT001Saved.cr6cb_evidencecaseid),
                "受付 " & Text(DateAdd(varT001Saved.createdon, TimeZoneOffset(varT001Saved.createdon) + 540, TimeUnit.Minutes), "[$-ja-JP]yyyy-mm-dd HH:mm") & " JST / 件ID " & Text(varT001Saved.cr6cb_evidencecaseid) & "。" & Coalesce(varS01FlowStatus, "2ファイルの保存内容を確認しています"),
                Coalesce(varS01FlowStatus, "Excelとログを各1件選び、環境・サーバー・対象処理日を確認してください")
              )
            Width: =Parent.Width - 50
            X: =25
            Y: =Parent.Height - 136
