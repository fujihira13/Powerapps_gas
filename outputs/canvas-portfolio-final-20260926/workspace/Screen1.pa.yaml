Screens:
  Screen1:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =If(
          Coalesce(varS01NewIntakeRequested, false),
          Set(varS01NewIntakeRequested, false);
          If(
            !Coalesce(varT001Saving, false) &&
            IsBlank(varT001SavingQueueId) &&
            !Coalesce(varS01Starting, false) &&
            !Coalesce(varS01StartUnknown, false) &&
            IsBlank(varT001UnknownQueueId) &&
            Coalesce(varS01FlowStatus, "") <> "開始状況を確認しています" &&
            CountIf(colS01StartResults, Outcome = "結果不明") = 0 &&
            IsEmpty(Filter(colT001Metadata, Coalesce(SaveStatus, "") <> "保存済み" || IsBlank(EvidenceCaseId))),
            Clear(colT001Metadata);
            Clear(colT001AttachmentSource);
            Set(varT001SelectedQueueId, Blank());
            Set(varT001Saved, Blank());
            Set(varEvidenceCase, Blank());
            Set(varS01FlowStatus, "");
            Clear(colS01StartResults);
            ResetForm(Form1);
            NewForm(Form1)
          )
        )
    Children:
      - Form1:
          Control: Form
          Variant: Classic
          Layout: Vertical
          Properties:
            BorderColor: =RGBA(245, 245, 245, 1)
            DataSource: ='架空ログ証跡件'
            DefaultMode: =FormMode.New
            Height: =Parent.Height - 140
            NumberOfColumns: =2
            OnFailure: |-
              =If(
                !Form1.Valid,
                Set(varT001Saving, false);
                Set(varT001SavingQueueId, Blank());
                Notify(Coalesce(Form1.Error, "入力内容を確認してください"), NotificationType.Error),
                Set(varT001FailureMetadataPatch, Blank());
                IfError(
                  Set(
                    varT001FailureMetadataPatch,
                    Patch(
                      colT001Metadata,
                      LookUp(colT001Metadata, QueueId = varT001SavingQueueId),
                      {SaveStatus: "保存結果不明"}
                    )
                  ),
                  Set(varT001FailureMetadataPatch, Blank())
                );
                If(
                  !IsBlank(varT001FailureMetadataPatch.QueueId) &&
                  varT001FailureMetadataPatch.QueueId = varT001SavingQueueId &&
                  varT001FailureMetadataPatch.SaveStatus = "保存結果不明",
                  If(varT001UnknownQueueId = varT001SavingQueueId, Set(varT001UnknownQueueId, Blank())),
                  Set(varT001UnknownQueueId, varT001SavingQueueId)
                );
                Set(varT001Saving, false);
                Notify("保存状況を確認しています", NotificationType.Warning)
              )
            OnSuccess: |-
              =Set(varT001SubmittedCaseId, Form1.LastSubmit.cr6cb_evidencecaseid);
              Set(varT001Saved, Blank());
              Set(varEvidenceCase, Blank());
              Set(varT001SaveVerified, false);
              Set(varT001ReadbackRefreshOk, true);
              Set(varT001ReadbackLookupOk, false);
              Set(varT001ReadbackAttachmentCount, -1);
              IfError(Refresh('架空ログ証跡件'), Set(varT001ReadbackRefreshOk, false));
              If(
                varT001ReadbackRefreshOk,
                Set(varT001ReadbackCase, IfError(LookUp('架空ログ証跡件', cr6cb_evidencecaseid = varT001SubmittedCaseId), Blank()));
                Set(varT001ReadbackLookupOk, !IsBlank(varT001ReadbackCase.cr6cb_evidencecaseid));
                If(
                  varT001ReadbackLookupOk,
                  IfError(Set(varT001ReadbackAttachmentCount, CountRows(varT001ReadbackCase.Attachments)), Set(varT001ReadbackAttachmentCount, -1))
                )
              );
              If(
                varT001ReadbackRefreshOk &&
                varT001ReadbackLookupOk &&
                !IsBlank(varT001ReadbackCase.cr6cb_evidencecaseid) &&
                varT001ReadbackCase.cr6cb_evidencecaseid = varT001SubmittedCaseId &&
                varT001ReadbackAttachmentCount = 1,
                Set(varT001StatusPatch, Blank());
                IfError(
                  Set(
                    varT001StatusPatch,
                    Patch(
                      '架空ログ証跡件',
                      varT001ReadbackCase,
                      {
                        cr6cb_processingstatus: "保存済み",
                        cr6cb_excelcheckstatus: "未確認",
                        cr6cb_reviewstatus: "未依頼"
                      }
                    )
                  ),
                  Set(varT001StatusPatch, Blank())
                );
                If(
                  !IsBlank(varT001StatusPatch.cr6cb_evidencecaseid),
                  Set(varT001ReadbackRefreshOk, true);
                  Set(varT001ReadbackLookupOk, false);
                  Set(varT001ReadbackAttachmentCount, -1);
                  IfError(Refresh('架空ログ証跡件'), Set(varT001ReadbackRefreshOk, false));
                  If(
                    varT001ReadbackRefreshOk,
                    Set(varT001ReadbackCase, IfError(LookUp('架空ログ証跡件', cr6cb_evidencecaseid = varT001SubmittedCaseId), Blank()));
                    Set(varT001ReadbackLookupOk, !IsBlank(varT001ReadbackCase.cr6cb_evidencecaseid));
                    If(
                      varT001ReadbackLookupOk,
                      IfError(Set(varT001ReadbackAttachmentCount, CountRows(varT001ReadbackCase.Attachments)), Set(varT001ReadbackAttachmentCount, -1))
                    )
                  );
                  If(
                    varT001ReadbackRefreshOk &&
                    varT001ReadbackLookupOk &&
                    !IsBlank(varT001ReadbackCase.cr6cb_evidencecaseid) &&
                    varT001ReadbackCase.cr6cb_evidencecaseid = varT001SubmittedCaseId &&
                    varT001ReadbackAttachmentCount = 1 &&
                    varT001ReadbackCase.cr6cb_processingstatus = "保存済み" &&
                    varT001ReadbackCase.cr6cb_excelcheckstatus = "未確認" &&
                    varT001ReadbackCase.cr6cb_reviewstatus = "未依頼",
                    Set(varT001MetadataPatch, Blank());
                    IfError(
                      Set(
                        varT001MetadataPatch,
                        Patch(
                          colT001Metadata,
                          LookUp(colT001Metadata, QueueId = varT001SavingQueueId),
                          {SaveStatus: "保存済み", EvidenceCaseId: varT001ReadbackCase.cr6cb_evidencecaseid}
                        )
                      ),
                      Set(varT001MetadataPatch, Blank())
                    );
                    If(
                      !IsBlank(varT001MetadataPatch.QueueId) &&
                      varT001MetadataPatch.QueueId = varT001SavingQueueId &&
                      varT001MetadataPatch.SaveStatus = "保存済み" &&
                      varT001MetadataPatch.EvidenceCaseId = varT001ReadbackCase.cr6cb_evidencecaseid,
                      Set(varT001SaveVerified, true)
                    )
                  )
                )
              );
              If(
                varT001SaveVerified,
                Set(varT001Saved, varT001ReadbackCase);
                Set(varEvidenceCase, varT001ReadbackCase);
                If(varT001UnknownQueueId = varT001SavingQueueId, Set(varT001UnknownQueueId, Blank()));
                Set(varT001Saving, false);
                Set(varT001SelectedQueueId, varT001SavingQueueId);
                Set(varT001SavingQueueId, Blank());
                ResetForm(Form1);
                NewForm(Form1),
                Set(varT001UnknownMetadataPatch, Blank());
                IfError(
                  Set(
                    varT001UnknownMetadataPatch,
                    Patch(
                      colT001Metadata,
                      LookUp(colT001Metadata, QueueId = varT001SavingQueueId),
                      {SaveStatus: "保存結果不明"}
                    )
                  ),
                  Set(varT001UnknownMetadataPatch, Blank())
                );
                If(
                  !IsBlank(varT001UnknownMetadataPatch.QueueId) &&
                  varT001UnknownMetadataPatch.QueueId = varT001SavingQueueId &&
                  varT001UnknownMetadataPatch.SaveStatus = "保存結果不明",
                  If(varT001UnknownQueueId = varT001SavingQueueId, Set(varT001UnknownQueueId, Blank())),
                  Set(varT001UnknownQueueId, varT001SavingQueueId)
                );
                Set(varT001Saving, false);
                Notify("保存状況を確認しています", NotificationType.Warning)
              )
            Width: =Parent.Width - 360
            X: =320
            Y: =40
