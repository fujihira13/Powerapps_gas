                          Collect(colS01StartResults, {EvidenceCaseId: startCase.Value, Outcome: "対象外"}),
                          If(
                            CountRows(
                              Filter(
                                colS01StartDestinations,
                                cr6cb_environment = caseRow.cr6cb_environment &&
                                cr6cb_server = caseRow.cr6cb_server &&
                                cr6cb_isactive = '有効 (架空ログ転記先)'.有効
                              )
                            ) <> 1,
                            IfError(
                              Patch(
                                '架空ログ証跡件',
                                caseRow,
                                {cr6cb_failurereason: "有効な転記先が一意に確認できません。"}
                              );
                              Collect(colS01StartResults, {EvidenceCaseId: startCase.Value, Outcome: "転記先なし"}),
                              Collect(colS01StartResults, {EvidenceCaseId: startCase.Value, Outcome: "理由保存失敗"})
                            ),
                            IfError(
                              Patch(
                                '架空ログ証跡件',
                                caseRow,
                                {
                                  cr6cb_processingstatus: "開始受付済み",
                                  cr6cb_failurereason: ""
                                }
                              );
                              IfError(
                                If(
                                  '架空ログ証跡_件別Excel転記'.Run(Text(startCase.Value)),
                                  Collect(colS01StartResults, {EvidenceCaseId: startCase.Value, Outcome: "受付済み"}),
                                  Collect(colS01StartResults, {EvidenceCaseId: startCase.Value, Outcome: "結果不明"})
                                ),
                                Collect(colS01StartResults, {EvidenceCaseId: startCase.Value, Outcome: "結果不明"})
                              ),
                              Collect(colS01StartResults, {EvidenceCaseId: startCase.Value, Outcome: "結果不明"})
                            )
                          )
                        )
                      )
                    ),
                    Collect(colS01StartResults, {EvidenceCaseId: startCase.Value, Outcome: "結果不明"})
                  )
                );
                Refresh('架空ログ証跡件');
                Set(varS01StartUnknown, CountIf(colS01StartResults, Outcome = "結果不明") > 0);
                Set(varS01Starting, false);
                If(
                  Coalesce(varS01StartUnknown, false) || CountIf(colS01StartResults, Outcome = "結果不明") > 0,
                  Set(varS01FlowStatus, "開始状況を確認しています"),
                  If(
                    CountIf(colS01StartResults, Outcome = "受付済み") > 0,
                    Set(varS01FlowStatus, "処理を開始しました");
                    Navigate(Screen2, ScreenTransition.None),
                    If(
                      CountIf(colS01StartResults, Outcome = "転記先なし" || Outcome = "理由保存失敗") > 0,
                      Set(varS01FlowStatus, If(CountIf(colS01StartResults, Outcome = "理由保存失敗") > 0, "転記先の理由を保存できませんでした", "転記先を確認してください")),
                      Set(varS01FlowStatus, "保存済みの対象を確認してください")
                    )
                  )
                )
              )
            Text: ="処理開始"
            Width: =160
            X: =Parent.Width - 190
            Y: =Parent.Height - 80
      - lblS01FlowStatus:
          Control: Label
          Properties:
            Color: =RGBA(120, 75, 0, 1)
            Live: =Live.Polite
            Text: =If(Coalesce(varS01StartUnknown, false), "開始状況を確認しています", Coalesce(varS01FlowStatus, ""))
            Width: =Parent.Width - 720
            X: =500
            Y: =Parent.Height - 78
